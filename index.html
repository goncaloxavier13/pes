<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pês">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>Pês</title>
<style>
/* Pês — Apple-style minimal: neutral greys, one blue accent, system type. Mobile column centred on wide screens. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --text:#000000; --muted:#8A8A8E;
  --border:#E3E3E8; --accent:#007AFF; --accent-soft:#E8F1FF; --on-accent:#FFFFFF;
  --green:#28A745; --green-soft:#E6F6EA; --red:#E5352B; --red-soft:#FDECEB; --orange:#F08C00; --gold:#E3A000;
  --overlay:rgba(0,0,0,.38); --shadow:0 10px 30px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:16px; --r-sm:12px; --gut:20px;
  --tabh:58px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-pes="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --text:#FFFFFF; --muted:#98989F;
    --border:#38383A; --accent:#0A84FF; --accent-soft:#0F2741; --on-accent:#FFFFFF;
    --green:#32D74B; --green-soft:#0F2E17; --red:#FF453A; --red-soft:#3A1412; --orange:#FF9F0A; --gold:#FFD60A;
    --overlay:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-pes="light"]), :root[data-pes="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --text:#FFFFFF; --muted:#98989F;
  --border:#38383A; --accent:#0A84FF; --accent-soft:#0F2741; --on-accent:#FFFFFF;
  --green:#32D74B; --green-soft:#0F2E17; --red:#FF453A; --red-soft:#3A1412; --orange:#FF9F0A; --gold:#FFD60A;
  --overlay:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input,textarea,select{font:inherit;color:var(--text)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:560px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.under{z-index:0;pointer-events:none}
.screen.swiping{z-index:1;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.sheet.swiping,.viewer.swiping,.gala.swiping{box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.sttap{position:absolute;left:0;right:0;top:0;height:max(var(--st),0px);z-index:40}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad-tabs{padding-bottom:calc(var(--tabh) + var(--sb) + 28px)}
.pad-bottom{padding-bottom:calc(var(--sb) + 28px)}

/* Headers — one system for the whole app */
.tabhead{padding:calc(var(--st) + 14px) calc(var(--gut) + var(--sr)) 10px calc(var(--gut) + var(--sl));display:flex;align-items:flex-end;gap:12px}
.tabhead .titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tabhead h1{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.6px}
.navhead{position:relative;z-index:2;flex:none;padding:calc(var(--st) + 8px) calc(14px + var(--sr)) 10px calc(14px + var(--sl));display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;background:var(--bg);border-bottom:.5px solid var(--border)}
.navhead h2{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navtitle{min-width:0;border-radius:10px;padding:2px 4px}
.navtitle:hover h2{opacity:.8}
.navhead .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roundbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--accent);flex:none}
.roundbtn.fill{background:var(--accent);color:var(--on-accent)}
.roundbtn svg{width:19px;height:19px}

/* Sections & cards */
.section{padding:0 calc(var(--gut) + var(--sr)) 0 calc(var(--gut) + var(--sl));margin-top:22px}
.label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:0 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label button{font-size:13px;font-weight:500;color:var(--accent);text-transform:none;letter-spacing:0}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.card.pad{padding:16px}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;position:relative;width:100%;text-align:left}
.list .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--border)}
.list .row .grow{flex:1;min-width:0}
.rowtitle{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowsub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .ico{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.empty .ico svg{width:22px;height:22px}
.empty h3{font-size:17px;font-weight:600}
.empty p{font-size:14px;color:var(--muted);max-width:30ch}

/* Buttons */
.btn{height:48px;border-radius:14px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn.secondary{background:var(--card);color:var(--accent)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btnrow{display:flex;gap:12px}
.btnrow .btn{flex:1;min-width:0;padding:0 10px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;align-self:flex-start;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{width:12px;height:12px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.grey{background:var(--card2);color:var(--muted)}
.chip svg{width:11px;height:11px}
.linkbtn{color:var(--accent);font-weight:500;font-size:15px}
.minibtn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.minibtn svg{width:13px;height:13px}
.iconbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}

/* Avatars */
.av{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden;color:#fff;background:var(--muted);user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.stack{display:flex;align-items:center}
.stack .av{box-shadow:0 0 0 2px var(--card)}
.stack .av+.av{margin-left:-9px}
.stack .more{background:var(--accent-soft);color:var(--accent)}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);padding:6px var(--sr) calc(var(--sb) + 4px) var(--sl);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--border)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--muted);height:48px;justify-content:center;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab.hometab{color:#fff}
.tab.hometab .hbub{flex:none;width:56px;height:56px;min-width:56px;min-height:56px;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;margin-top:-26px;box-sizing:border-box;border:4px solid var(--card);box-shadow:0 3px 10px rgba(0,0,0,.18);background-clip:padding-box}
.tab.hometab .hbub svg{width:24px;height:24px;display:block}
.tab.hometab span:last-child{color:var(--muted)}
.tab.hometab.on span:last-child{color:var(--accent);font-weight:600}
.tab.hometab .badge{top:-24px;left:calc(50% + 10px)}
.tabhead .titles .gname{font-family:inherit;line-height:1.2;letter-spacing:0;font-size:15px;font-weight:600;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.4px}
.stat .k{font-size:12px;font-weight:600;line-height:1.2}
.stat .s{font-size:11px;color:var(--muted);line-height:1.2}
.stat.cta{background:var(--accent);color:var(--on-accent);justify-content:space-between;text-align:left}
.stat.cta .k{font-size:13px}
.stat.cta .s{color:color-mix(in srgb,var(--on-accent) 80%,transparent)}
.stat.cta svg{width:20px;height:20px}
.stat.done{background:var(--card);color:var(--text)}
.stat.done svg{color:var(--green)}
.stat.done .s{color:var(--muted)}

.bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.rank{width:26px;text-align:center;font-weight:700;font-size:14px;color:var(--muted);flex:none}
.rank.gold{color:var(--gold)}

/* Events */
.ev{display:flex;gap:14px;padding:14px 16px}
.datebox{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--card2);padding:6px 0}
.datebox b{display:block;font-size:19px;font-weight:700;line-height:1.1}
.datebox span{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--red)}
.ev h3{font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.ev .desc{font-size:14px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.place{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;max-width:100%}
.place svg{width:14px;height:14px;flex:none}.place span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--orange);color:#fff;font-size:14px}
.soon svg{width:18px;height:18px;flex:none;margin-top:1px}.soon a{display:block;color:#fff;opacity:.9;font-size:13px;margin-top:2px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos button{aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--card2);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .bar2{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 10px) 16px 10px;color:#fff;font-size:14px}
.viewer .bar2 button{color:#fff;font-size:16px}
.presence{border-top:.5px solid var(--border);padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
.presence .q{font-size:12px;font-weight:500;color:var(--muted)}
.seg2{display:flex;gap:10px}
.seg2 button{flex:1;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card2);font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg2 button svg{width:15px;height:15px}
.seg2 button.yes{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.seg2 button.no{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.notice{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.notice .n{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Journey */
.votechip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);width:100%;text-align:left;font-size:15px;font-weight:500;color:var(--muted)}
.votechip.set{border-color:var(--accent);color:var(--accent)}
.votechip.local{background:var(--accent-soft)}
.votechip .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.votechip svg{width:16px;height:16px;flex:none}
.dots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--on-accent)}
.dot.on{background:var(--accent)}
.dot svg{width:12px;height:12px}
.floatbar{position:absolute;left:0;right:0;bottom:calc(var(--tabh) + var(--sb) + 10px);z-index:4;padding:0 calc(var(--gut) + var(--sr)) 0 calc(var(--gut) + var(--sl))}
.floatbar .btn{box-shadow:var(--shadow)}
.award{display:flex;align-items:center;gap:10px}
.award .emo{font-size:24px;line-height:1;width:30px;text-align:center;flex:none}
.award h3{font-size:17px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.toggle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px 0;font-size:13px;font-weight:500;color:var(--muted)}
.toggle svg{width:14px;height:14px}

/* Home */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--card);display:grid;place-items:center;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.logo svg{width:32px;height:32px}
.logo.big{width:84px;height:84px;border-radius:22px}
.logo.big svg{width:58px;height:58px}
.brand b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.3px}
.hello{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:22px;text-align:center}
.hello p{font-size:14px;color:var(--muted)}
.hello h2{font-family:var(--display);font-size:24px;font-weight:700}
.gcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px}
.gcard+.gcard{margin-top:12px}
.gtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gcard{cursor:pointer;-webkit-tap-highlight-color:transparent}
.gcard:active{transform:scale(.99)}
.gside{display:flex;align-items:center;gap:8px;flex:none}
.gcount{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--red);color:#fff!important;font-size:12px;font-weight:700;display:grid;place-items:center}
.ginfo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.ginfo svg{width:20px;height:20px}
.gnotes{font-size:13px;color:var(--red);font-weight:500;margin:-4px 0 12px}
.gfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gphoto{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none}
.gphoto img{width:100%;height:100%;object-fit:cover}
.gphoto svg{width:24px;height:24px}

/* Chat */
.chatrow .dotu{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.msgs{padding:12px 14px 8px;display:flex;flex-direction:column;gap:2px}
.day{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);padding:4px 10px;border-radius:10px;margin:12px 0 8px}
.m{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.m.me{justify-content:flex-end}
.m .col{display:flex;flex-direction:column;max-width:76%;min-width:0}
.m.me .col{align-items:flex-end}
.m .who{font-size:12px;color:var(--muted);margin:6px 0 2px 12px}
.bub{padding:8px 13px;border-radius:18px;background:var(--card);font-size:16px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me .bub{background:var(--accent);color:var(--on-accent)}
.m .t{font-size:11px;color:var(--muted);margin:3px 8px 6px}
.m .avs{width:28px;flex:none}
.composer{flex:none;display:flex;align-items:flex-end;gap:10px;padding:8px calc(14px + var(--sr)) calc(var(--sb) + 8px) calc(14px + var(--sl));background:var(--bg);border-top:.5px solid var(--border)}
.composer textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--card);border-radius:20px;padding:9px 14px;min-height:40px;max-height:120px;line-height:1.35;font-size:16px;outline:none}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.composer .send:disabled{background:var(--card2);color:var(--muted);opacity:1}
.composer .send svg{width:18px;height:18px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field+.field{margin-top:16px}
.field label,.flabel{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-left:4px}
.input{width:100%;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:0 14px;font-size:16px;outline:none}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--accent)}
.code{letter-spacing:6px;text-align:center;font-size:22px;font-weight:600;text-transform:uppercase}
.hint{font-size:13px;color:var(--muted);margin:2px 4px 0}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Sheets, dialogs, toasts */
.layer{position:absolute;inset:0;z-index:20}

/* ───────────────────────── in-memory store (preview when the shared store is unavailable) ───────────────────────── */
function MemDB(initial){
  const data=new Map(Object.entries(initial||{})); const subs=new Set();
  const notify=()=>queueMicrotask(()=>subs.forEach(s=>s()));
  const snap=(id,d)=>({id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});
  const merge=(a,b)=>{ const o={...a}; for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a&&typeof a[k]==="object"&&!Array.isArray(a[k])) o[k]=merge(a[k],b[k]); else o[k]=b[k]; } return o; };
  const docRef=path=>({id:path.split("/").pop(),path,
    get:async()=>snap(path.split("/").pop(),data.get(path)),
    set:async v=>{ data.set(path,JSON.parse(JSON.stringify(v))); notify(); },
    update:async v=>{ if(!data.has(path)) throw {code:"invalid_argument"}; data.set(path,merge(data.get(path),JSON.parse(JSON.stringify(v)))); notify(); },
    delete:async()=>{ data.delete(path); notify(); },
    acquire:async()=>({acquired:true}),
    onSnapshot:(next)=>{ const f=()=>next(snap(path.split("/").pop(),data.get(path))); subs.add(f); f(); return ()=>subs.delete(f); },
    collection:p=>colRef(path+"/"+p)});
  const colRef=(path,q={})=>{ const run=()=>{ const depth=path.split("/").length+1; let docs=[...data.entries()].filter(([p])=>p.startsWith(path+"/")&&p.split("/").length===depth).map(([p,d])=>snap(p.split("/").pop(),d));
      (q.w||[]).forEach(([f,op,v])=>{ docs=docs.filter(s=>{ const x=s.data()[f]; return op==="=="?x===v:op==="array-contains"?(x||[]).includes(v):true; }); });
      if(q.o){ const [f,dir]=q.o; docs.sort((a,b)=>((a.data()[f]>b.data()[f])?1:-1)*(dir==="desc"?-1:1)); }
      if(q.l) docs=docs.slice(0,q.l); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}}; };
    return {path,doc:id=>docRef(path+"/"+(id||uidGen())),add:async v=>{ const r=docRef(path+"/"+uidGen()); await r.set(v); return r; },
      where:(f,op,v)=>colRef(path,{...q,w:[...(q.w||[]),[f,op,v]]}),orderBy:(f,d)=>colRef(path,{...q,o:[f,d]}),limit:n=>colRef(path,{...q,l:n}),
      get:async()=>run(),onSnapshot:next=>{ const f=()=>next(run()); subs.add(f); f(); return ()=>subs.delete(f); }}; };
  return {doc:docRef,collection:p=>colRef(p)};
}

const groupEvents = gid => Object.entries(S.events).filter(([,e])=>e.groupId===gid).map(([id,e])=>({id,...e}))

const presentKeys = e => Object.keys(e.att||{}).filter(k=>statusOf(e,k)==="yes");

/* Events today or tomorrow that I'm going to (or haven't answered) */
function upcomingSoon(gid){ const me=ME(); const t=lisbonYMD(), tm=tomorrowYMD();
  return groupEvents(gid).filter(e=>(e.date===t||e.date===tm)&&(e.att||{})[me]!==undefined&&statusOf(e,me)!=="no").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); }

function eventStats(gid,k){
  const evs=groupEvents(gid); const created=evs.filter(e=>e.createdBy===k).length;
  const past=evs.filter(e=>!isFuture(e) && (e.att||{})[k]!==undefined);
  const attended=past.filter(e=>statusOf(e,k)==="yes").length;
  return {created, attended, invited:past.length, rate:pct(attended,past.length)};

/* Average friendship ranking: each ranker's most recent ranking up to week w, averaged per person */
function averages(gid, uptoWeek=curWeek()){
  const g=S.groups[gid]; if(!g) return [];
  const sums={};
  (g.members||[]).forEach(r=>{
    const weeks=S.rankings[r]?.weeks||{}; const ks=Object.keys(weeks).filter(w=>w<=uptoWeek && weeks[w]?.[gid]).sort();
    if(!ks.length) return; const rk=weeks[ks[ks.length-1]][gid];
    Object.entries(rk).forEach(([t,v])=>{ if(!(g.members||[]).includes(t)) return; (sums[t]=sums[t]||{s:0,n:0}); sums[t].s+=v; sums[t].n++; });
  });
  return Object.entries(sums).map(([k,v])=>({k,avg:v.s/v.n,n:v.n})).sort((a,b)=>a.avg-b.avg);
}
function rankingHistory(gid){
  const weeks=weeksBack(52); const out=[];
  for(const w of weeks){ const av=averages(gid,w); if(av.length) out.push({w,av}); }
  return out;
}
function myRankingThisWeek(gid){ return S.rankings[ME()]?.weeks?.[curWeek()]?.[gid] || null; }
function rankingWeeksDone(k,gid,n=8){ const ws=weeksBack(n); return ws.filter(w=>S.rankings[k]?.weeks?.[w]?.[gid]).length; }
function voteWeeksDone(k,gid,n=8){ const aw=groupAwards(gid).map(a=>a.id); const ws=weeksBack(n); return ws.filter(w=>{ const v=S.votes[k]?.weeks?.[w]||{}; return aw.some(a=>v[a]); }).length; }
function activityScore(gid,k){ const st=eventStats(gid,k); const rate=st.invited?st.rate/100:0;
  return Math.round(100*(.4*rate + .3*rankingWeeksDone(k,gid)/8 + .3*voteWeeksDone(k,gid)/8)); }
const seasonWeeks = () => { const y=curWeek().slice(0,4); return weeksBack(53).filter(w=>w.startsWith(y)); };
function standings(gid,awardId,upto=curWeek()){
  const g=S.groups[gid]; if(!g) return {list:[],total:0}; const counts={}; let total=0; const y=upto.slice(0,4);
  (g.members||[]).forEach(v=>{ const ws=S.votes[v]?.weeks||{}; Object.entries(ws).forEach(([w,vv])=>{ if(!w.startsWith(y)||w>upto) return; const n=vv[awardId]; if(n&&(g.members||[]).includes(n)){ counts[n]=(counts[n]||0)+1; total++; } }); });
  const list=Object.entries(counts).map(([k,c])=>({k,votes:c,p:pct(c,total)})).sort((a,b)=>b.votes-a.votes||nm(a.k).localeCompare(nm(b.k)));
  return {list,total};
}
function voterCount(gid,awardId){ const g=S.groups[gid]; const w=curWeek(); return (g?.members||[]).filter(v=>S.votes[v]?.weeks?.[w]?.[awardId]).length; }
const myVote = (awardId) => S.localVotes[awardId] ?? S.votes[ME()]?.weeks?.[curWeek()]?.[awardId] ?? null;

function pendingFor(k){ return Object.entries(S.events).filter(([,e])=>(e.att||{})[k]==="pending" && e.createdBy!==k && S.groups[e.groupId]?.members?.includes(k)).map(([id,e])=>({id,...e})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")); }
function chatsOf(gid){ const me=ME(); return Object.entries(S.chats).filter(([,c])=>c.groupId===gid && (c.members||[]).includes(me)).map(([id,c])=>({id,...c})).sort((a,b)=>(b.lastAt||b.createdAt||0)-(a.lastAt||a.createdAt||0)); }
function isUnread(c){ const me=ME(); if(!c.lastAt||c.lastFrom===me) return false; return c.lastAt > (S.reads[me]?.chats?.[c.id]||0); }
function unreadCount(){ const me=ME(); return Object.entries(S.chats).filter(([id,c])=>(c.members||[]).includes(me)&&S.groups[c.groupId]?.members?.includes(me)&&isUnread({id,...c})).length; }
function voteClosing(gid){ const dow=ymdToUTC(lisbonYMD()).getUTCDay(); if(dow!==6&&dow!==0) return false;
  const g=S.groups[gid]; const me=ME(); const wk=curWeek(); const v=S.votes[me]?.weeks?.[wk]||{};
  const missVote=groupAwards(gid).some(a=>!v[a.id]&&!(gid===S.groupId&&S.localVotes[a.id])); const missRank=(g?.members||[]).length>1&&!myRankingThisWeek(gid);
  return missVote||missRank; }
function groupNotifs(gid){ const me=ME(); const msgs=chatsOf(gid).filter(isUnread).length; const evs=pendingFor(me).filter(e=>e.groupId===gid).length; const vote=voteClosing(gid);
  return {msgs,evs,vote,total:msgs+evs+(vote?1:0)}; }
function chatTitle(c){ const me=ME(); if(c.type==="direct"){ const o=(c.members||[]).find(k=>k!==me); return nm(o)||"Conversa"; } return c.name || (c.members||[]).filter(k=>k!==me).map(k=>first(nm(k))).join(", ") || "Grupo"; }

async function write(fn, okMsg){
  if (!S.db) return false;
  try { await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const code=e?.code; console.warn(e);
    if (code==="permission-denied") { await alertD("Sem permissão","Não tens permissão para fazer isto neste grupo."); return false; }
    if (code==="invalid_argument" && !S.preview) { S.canWrite=false; await alertD("Sem permissão para alterar","A tua conta só pode ver esta app. Pede ao dono para te dar acesso de edição."); }
    else if (code==="quota_exceeded") await alertD("Espaço cheio","A base de dados da app chegou ao limite. Apaga conversas ou eventos antigos.");
    else await alertD("Não foi possível guardar","Verifica a ligação e tenta outra vez.");
    return false;
  }
}

/* ───────────────────────── UI primitives: dialogs, sheets, toasts ───────────────────────── */
const app = document.getElementById("app");
let layers=[];
function pushLayer(html, onClose){ const el=document.createElement("div"); el.className="layer"; el.innerHTML=html; app.appendChild(el); const L={el,onClose}; layers.push(L); return L; }
function popLayer(L){ L=L||layers[layers.length-1]; if(!L) return; layers=layers.filter(x=>x!==L); L.el.remove(); try{ L.onClose&&L.onClose(); }catch{} }
function toast(msg){ app.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; app.appendChild(t); setTimeout(()=>t.remove(),2200); }
function dialog(title,msg,buttons){ return new Promise(res=>{
  const L=pushLayer(`<div class="overlay"></div><div class="dialog" role="alertdialog" aria-modal="true"><div class="dt"><h3></h3>${msg?"<p></p>":""}</div><div class="db">${buttons.map((b,i)=>`<button data-i="${i}" class="${b.danger?"danger":""}"></button>`).join("")}</div></div>`);
  L.el.querySelector("h3").textContent=title; if(msg) L.el.querySelector("p").textContent=msg;
  L.el.querySelectorAll("[data-i]").forEach(b=>{ b.textContent=buttons[+b.dataset.i].t; b.onclick=()=>{ popLayer(L); res(buttons[+b.dataset.i].v); }; });
  L.el.querySelector("[data-i]:last-child").focus();
}); }
const alertD = (t,m) => dialog(t,m,[{t:"OK",v:true}]);
const confirmD = (t,m,ok="Confirmar",danger=false) => dialog(t,m,[{t:"Cancelar",v:false},{t:ok,v:true,danger}]);
function actionSheet(title, opts){ return new Promise(res=>{
  const L=pushLayer(`<div class="overlay" data-x></div><div class="actions" role="dialog" aria-modal="true"><div class="grp">${title?'<div class="ttl"></div>':""}${opts.map((o,i)=>`<button data-i="${i}" class="${o.danger?"danger":""} ${o.sel?"sel":""}"></button>`).join("")}</div><div class="grp"><button class="cancel" data-x>Cancelar</button></div></div>`);
  if(title) L.el.querySelector(".ttl").textContent=title;
  L.el.querySelectorAll("[data-i]").forEach(b=>{ const o=opts[+b.dataset.i]; b.innerHTML=(o.sel?ic("check",'style="width:18px;height:18px"'):"")+`<span></span>`; b.querySelector("span").textContent=o.t; b.onclick=()=>{ popLayer(L); res(o.v); }; });
  L.el.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ popLayer(L); res(null); });
}); }
/* A sheet = full-height modal with the app's one header style: [Cancelar] Title [Action] */
function openSheet({title, left="Cancelar", right=null, rightDisabled=false, body, short=false, live=false, onRight, onMount}){
  const L=pushLayer(`<div class="overlay" data-close></div><div class="sheet ${short?"short":""}" role="dialog" aria-modal="true"><div class="sheethead"><button class="l" data-close></button><h2></h2>${right?`<button class="r" data-right ${rightDisabled?"disabled":""}></button>`:"<span></span>"}</div><div class="sheetbody"></div></div>`);
  L.el.querySelector("h2").textContent=title; L.el.querySelector(".l").textContent=left; if(right) L.el.querySelector("[data-right]").textContent=right;
  L.body=L.el.querySelector(".sheetbody"); L.right=L.el.querySelector("[data-right]");
  L.render=()=>{ const st=L.body.scrollTop; L.body.innerHTML=body(L); L.body.scrollTop=st; drawCharts(L.body); };
  L.live=live; L.render();
  L.el.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>popLayer(L));
  if(L.right) L.right.onclick=()=>onRight&&onRight(L);
  onMount&&onMount(L);
  return L;
}
function setRight(L,enabled){ if(L.right) L.right.disabled=!enabled; }

/* ───────────────────────── charts (measured, never wider than their card) ───────────────────────── */
let chartSpecs=new Map(); let chartSeq=0;
function chartBox(spec){ const id="c"+(++chartSeq); chartSpecs.set(id,spec); return `<div class="chart" data-chart="${id}"></div>`; }
function drawCharts(root){
  root.querySelectorAll("[data-chart]").forEach(box=>{
    const spec=chartSpecs.get(box.dataset.chart); if(!spec) return;
    const W=Math.max(220,Math.floor(box.clientWidth)); const H=spec.h||200; box.style.minHeight=H+"px";
    const PL=34, PR=12, PT=12, PB=30; const cw=W-PL-PR, ch=H-PT-PB; const n=spec.points.length;
    const {min,max,invert}=spec;
    const x=i=>PL+(n===1?cw/2:i*cw/(n-1));
    const y=v=>{ const r=Math.max(0,Math.min(1,(v-min)/((max-min)||1))); return invert?PT+r*ch:PT+ch-r*ch; };
    const css=getComputedStyle(box); const muted=css.getPropertyValue("--muted").trim(); const border=css.getPropertyValue("--border").trim();
    let g="";
    const ticks=spec.ticks||[min,(min+max)/2,max];
    ticks.forEach(t=>{ g+=`<line x1="${PL}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}" stroke="${border}" stroke-dasharray="3 4"/><text x="${PL-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="${muted}">${esc(spec.fmt(t))}</text>`; });
    const maxLabels=W<360?4:6; const step=Math.max(1,Math.ceil(n/maxLabels));
    spec.points.forEach((p,i)=>{ if(i%step===0||i===n-1){ if(i!==n-1 && n-1-i<step*.6) return; const anchor=i===0?"start":i===n-1?"end":"middle"; g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${anchor}" font-size="10" fill="${muted}">${esc(p.label)}</text>`; } });
    spec.series.forEach((s,si)=>{
      const col=s.color; let d="", area="", seg=[];
      const flush=()=>{ if(seg.length>1){ d+=seg.map((p,j)=>(j?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+" "; } seg=[]; };
      spec.points.forEach((p,i)=>{ const v=p.values[s.key]; if(v==null){ flush(); return; } seg.push([x(i),y(v)]); }); flush();
      g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      spec.points.forEach((p,i)=>{ const v=p.values[s.key]; if(v==null) return; const last=i===n-1||spec.points.slice(i+1).every(q=>q.values[s.key]==null); g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?4:2.6}" fill="${col}" ${last?`stroke="var(--card)" stroke-width="2"`:""}/>`; });
    });
    box.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria||"Gráfico")}">${g}</svg>`;
  });
}
function legend(series){ return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`; }

/* Deep links from push notifications: ?g=<group>&t=<tab>&c=<chat> */
function parseLink(u){ try{ const q=new URL(u,location.href).searchParams; const g=q.get("g"); if(!g) return null; return {g,t:q.get("t")||"dash",c:q.get("c")}; }catch{ return null; } }
S.pendingLink=parseLink(location.href); if(S.pendingLink){ try{ history.replaceState(null,"",location.pathname); }catch{} }
navigator.serviceWorker?.addEventListener?.("message",e=>{ if(e.data?.type==="open"){ const l=parseLink(e.data.url); if(l){ S.pendingLink=l; render(); } } });
function applyLink(){ const l=S.pendingLink; if(!l||!S.loaded.has("ready")||!ME()) return; S.pendingLink=null;
  if(!myGroups().some(g=>g.id===l.g)) return; if(S.groupId!==l.g) S.localVotes={}; S.groupId=l.g; lsSet("group",l.g);
  S.tab=["dash","events","journey","gap"].includes(l.t)?l.t:"dash"; S.route=[]; if(l.c&&S.chats[l.c]) S.route=[{name:"chat",arg:l.c}]; }
let scrollMem={}; let lastKey=""; let renderQueued=false;
function scheduleRender(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; if(S.fb&&S.uid&&fbSubs.length) fbScope(); render(); layers.forEach(L=>L.live&&L.render()); }); }

function applyTheme(){
  const root=document.documentElement;
  if (S.theme==="system") root.removeAttribute("data-pes"); else root.setAttribute("data-pes",S.theme);
  const dark = S.theme==="dark" || (S.theme==="system" && (root.getAttribute("data-theme")==="dark" || (root.getAttribute("data-theme")!=="light" && matchMedia("(prefers-color-scheme: dark)").matches)));
  document.querySelector('meta[name="theme-color"]').content = dark?"#000000":"#F2F2F7";
}

/* Screens register chart specs while building their html, so reset the registry first. */
function render(){ if(S.swiping){ S.renderPending=true; return; } chartSpecs=new Map(); chartSeq=0; renderInner(); }
function renderInner(){
  applyLink();
  const r=topRoute(); const key = r ? r.name+":"+(r.arg||"") : "tab:"+S.tab;
  const old=app.querySelector(".screen .scroll[data-key]"); if(old) scrollMem[old.dataset.key]=old.scrollTop;
  if (r?.name==="chat" && ME() && app.querySelector(`.screen[data-chat="${r.arg}"]`)) { updateChat(r.arg); return; }
  const html=screenHtml(r);
  const scr=document.createElement("div"); scr.className="screen"; if(r?.name==="chat") scr.dataset.chat=r.arg;
  scr.innerHTML=html; const prev=app.querySelector(".screen:not(.under)"); app.querySelectorAll(".screen.under").forEach(x=>x.remove()); if(prev) app.replaceChild(scr,prev); else app.prepend(scr);
  const sc=scr.querySelector(".scroll[data-key]"); if(sc && scrollMem[sc.dataset.key]!=null) sc.scrollTop=scrollMem[sc.dataset.key];
  drawCharts(scr);
  if (r?.name==="chat" && ME()) mountChat(r.arg, scr);
}
function screenHtml(r){
  let html;
  if (S.fb && S.authKnown && !S.uid) html=authScreen();
  else if (FBCFG && !S.authKnown) html=`<div class="center"><div class="spinner"></div></div>`;
  else if (!S.loaded.has("ready")) html=`<div class="center"><div class="spinner"></div><p class="muted small">${S.stale?"A base de dados ainda não respondeu. Verifica a ligação.":"A carregar…"}</p></div>`;

  else html=({home:homeScreen,dash:dashScreen,events:eventsScreen,journey:journeyScreen,gap:gapScreen})[S.tab]() + tabbar();
  return html;
}

let chatSub=null, chatMsgs=[], chatId=null, chatLoaded=false;
function chatShell(cid){

}
function mountChat(cid,scr){
  if(chatId!==cid){ chatSub&&chatSub(); chatMsgs=[]; chatLoaded=false; chatId=cid;
    chatSub=S.db.collection(`chats/${cid}/msgs`).orderBy("at","desc").limit(300).onSnapshot(s=>{ chatMsgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse(); chatLoaded=true; updateChat(cid); markRead(cid); }, ()=>{ chatLoaded=true; updateChat(cid); }); }
  else updateChat(cid);
  const ta=scr.querySelector("#msgInput"), btn=scr.querySelector("#sendBtn"), form=scr.querySelector("#composer");
  const draft=lsGet("draft:"+cid,""); ta.value=draft; btn.disabled=!draft.trim();
  const fit=()=>{ ta.style.height="auto"; ta.style.height=Math.min(120,ta.scrollHeight)+"px"; };
  ta.addEventListener("input",()=>{ btn.disabled=!ta.value.trim(); fit(); lsSet("draft:"+cid,ta.value); });
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit",async e=>{ e.preventDefault(); const text=ta.value.trim(); if(!text) return; ta.value=""; lsSet("draft:"+cid,""); btn.disabled=true; fit();
    const me=ME(); const at=Date.now();
    const ok=await write(async()=>{ await S.db.collection(`chats/${cid}/msgs`).add({from:me,text,at}); await D("chats/"+cid).update({lastAt:at,lastText:text.slice(0,140),lastFrom:me}); });
    if(!ok){ ta.value=text; btn.disabled=false; } ta.focus(); });
  fit();
}
function updateChat(cid){
  const box=document.getElementById("msgs"); if(!box) return; const sc=document.getElementById("msgScroll");
  const atBottom=sc.scrollHeight-sc.scrollTop-sc.clientHeight<80;
  if(!chatLoaded){ return; }
  const me=ME(); const c=S.chats[cid]||{};
  if(!chatMsgs.length){ box.innerHTML=`<div class="empty" style="margin-top:40px"><div class="ico">${ic("chat")}</div><h3>Sem mensagens</h3><p>Diz olá 👋</p></div>`; return; }
  let html="", lastDay="";
  chatMsgs.forEach((m,i)=>{
    const day=lisbonYMD(new Date(m.at)); if(day!==lastDay){ html+=`<div class="day">${esc(dayLabel(m.at))}</div>`; lastDay=day; }
    const prev=chatMsgs[i-1], next=chatMsgs[i+1]; const mine=m.from===me;
    const firstOf=!prev||prev.from!==m.from||lisbonYMD(new Date(prev.at))!==day||m.at-prev.at>5*6e4;
    const lastOf=!next||next.from!==m.from||lisbonYMD(new Date(next.at))!==day||next.at-m.at>5*6e4;
    html+=`<div class="m ${mine?"me":""}">${!mine&&c.type!=="direct"?`<span class="avs">${lastOf?avatar(m.from,28):""}</span>`:""}<div class="col">${!mine&&firstOf&&c.type!=="direct"?`<span class="who">${esc(nm(m.from)||"")}</span>`:""}<div class="bub"></div>${lastOf?`<span class="t">${hhmm(m.at)}</span>`:""}</div></div>`;
  });
  box.innerHTML=html; box.querySelectorAll(".bub").forEach((b,i)=>b.textContent=chatMsgs[i].text);

}

function rankSheet(){
  const g=curGroup(); const me=ME(); const others=g.members.filter(k=>k!==me);
  const prevWeeks=Object.keys(S.rankings[me]?.weeks||{}).filter(w=>S.rankings[me].weeks[w][g.id]).sort();
  const cur=myRankingThisWeek(g.id) || (prevWeeks.length? S.rankings[me].weeks[prevWeeks[prevWeeks.length-1]][g.id] : null);
  let ranked = cur? Object.entries(cur).filter(([k])=>others.includes(k)).sort((a,b)=>a[1]-b[1]).map(([k])=>k) : [];
  let unr = others.filter(k=>!ranked.includes(k)).sort((a,b)=>nm(a).localeCompare(nm(b)));
  const done=!!myRankingThisWeek(g.id);
  const L=openSheet({title:"Ranking de amizade",right:"Submeter",rightDisabled:unr.length>0,
    body:()=>`<div class="banner" style="margin:0 0 16px">${ic("lock")}<span>Semana de ${esc(weekRange(curWeek()))}. Podes alterar até domingo às 23:59 (hora de Portugal). Depois fica guardado no histórico.</span></div>
      ${!done&&cur?`<p class="hint" style="margin:-6px 4px 12px">Começámos com o teu ranking da semana passada. Ajusta e submete.</p>`:""}
      <div class="label"><span>A tua ordem · 1 = mais amigo</span><span class="num" style="text-transform:none">${ranked.length}/${others.length}</span></div>
      <div class="bar" style="margin:0 4px 10px"><i style="width:${pct(ranked.length,others.length)}%"></i></div>
      ${ranked.length?`<div class="card">${ranked.map((k,i)=>`<div class="rankrow"><span class="n num">${i+1}</span>${avatar(k,32)}<span class="grow rowtitle" style="flex:1;min-width:0">${esc(nm(k))}</span>
        <button class="iconbtn" data-mv="${i}|-1" aria-label="Subir" ${i===0?"disabled":""}>${ic("up")}</button><button class="iconbtn" data-mv="${i}|1" aria-label="Descer" ${i===ranked.length-1?"disabled":""}>${ic("down")}</button><button class="iconbtn" data-rm="${i}" aria-label="Tirar do ranking">${ic("x")}</button></div>`).join("")}</div>`
        :`<div class="card"><div class="empty"><p>Toca nos nomes abaixo pela ordem que quiseres. O primeiro fica em 1.º.</p></div></div>`}
      ${unr.length?`<div class="label" style="margin-top:18px">Por ordenar · toca para pôr na posição ${ranked.length+1}</div><div class="chips">${unr.map(k=>`<button class="namechip" data-add="${k}">${avatar(k,26)}${esc(nm(k))}</button>`).join("")}</div>`:""}
      <button class="btn block" style="margin-top:22px" data-submit ${unr.length?"disabled":""}>Submeter ranking de amizade</button>`,
    onMount:L=>{ L.body.addEventListener("click",e=>{ const t=e.target.closest("button"); if(!t) return;
      if(t.dataset.add){ unr=unr.filter(k=>k!==t.dataset.add); ranked.push(t.dataset.add); }
      else if(t.dataset.rm!=null){ const k=ranked.splice(+t.dataset.rm,1)[0]; unr.push(k); unr.sort((a,b)=>nm(a).localeCompare(nm(b))); }
      else if(t.dataset.mv){ const [i,d]=t.dataset.mv.split("|").map(Number); const j=i+d; [ranked[i],ranked[j]]=[ranked[j],ranked[i]]; }
      else if(t.hasAttribute("data-submit")){ L.right.click(); return; } else return;
      L.render(); setRight(L,!unr.length); }); },
    onRight:async L=>{ if(unr.length) return; setRight(L,false); const w=curWeek(); const r={}; ranked.forEach((k,i)=>r[k]=i+1);
      const doc=S.rankings[me]?JSON.parse(JSON.stringify(S.rankings[me])):{weeks:{}}; doc.weeks=doc.weeks||{}; doc.weeks[w]={...(doc.weeks[w]||{}),[g.id]:r};

async function toThumb(file,size=192){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s=Math.min(img.naturalWidth,img.naturalHeight); const c=document.createElement("canvas"); c.width=c.height=size;
    c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size); return c.toDataURL("image/jpeg",.82); }
  finally{ URL.revokeObjectURL(url); }
}

/* Replace the whole store with `docs` (path → body), deleting everything else. Paced writes with retries and a progress overlay. */
async function bulk(docs,label){
  const L=pushLayer(`<div class="overlay"></div><div class="dialog"><div class="dt"><div class="spinner" style="margin:0 auto 12px"></div><h3></h3><p class="num">A preparar…</p></div></div>`);
  L.el.querySelector("h3").textContent=label+"…"; const p=L.el.querySelector("p");
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const retry=async fn=>{ for(let i=0;;i++){ try{ return await fn(); } catch(e){ if(i<6&&["resource_exhausted","unavailable","resource-exhausted"].includes(e?.code)){ await sleep(500*2**i); continue; } throw e; } } };
  try{
    const del=[];
    for(const c of S.fb?[...COLS,"uids"]:[...COLS,"owners","profiles"]){ const snap=await retry(()=>S.db.collection(c).get()); for(const d of snap.docs){ del.push(`${c}/${d.id}`);
      if(c==="chats"){ const ms=await retry(()=>S.db.collection(`chats/${d.id}/msgs`).get()); ms.docs.forEach(m=>del.push(`chats/${d.id}/msgs/${m.id}`)); } } }
    const toDel=del.filter(x=>!(x in docs)); const toSet=Object.entries(docs); const total=toDel.length+toSet.length; let n=0;
    if(S.fb){ const ops=[...toDel.map(x=>[x,null]),...toSet];
      for(let i=0;i<ops.length;i+=400){ const b=S.raw.batch(); ops.slice(i,i+400).forEach(([path,body])=> body===null? b.delete(S.raw.doc(path)) : b.set(S.raw.doc(path),body)); await retry(()=>b.commit()); n+=Math.min(400,ops.length-i); p.textContent=`${n} de ${total}`; } }
    else {
    for(const path of toDel){ await retry(()=>D(path).delete()); p.textContent=`${++n} de ${total}`; await sleep(25); }
    for(const [path,body] of toSet){ await retry(()=>D(path).set(body)); p.textContent=`${++n} de ${total}`; await sleep(25); } }
    popLayer(L); return true;
  } catch(e){ popLayer(L); await alertD("A operação parou a meio","Tenta outra vez. Os dados podem ter ficado incompletos até repetires."); return false; }
}

/* ───────── swipe from the left edge to go back (like iOS) ───────── */
(()=>{
  let sw=null; const EDGE=28;
  function target(){
    const L=layers[layers.length-1];
    if(L){ const c=L.el.querySelector("[data-close],[data-x]"); if(!c) return null;
      return {el:L.el.querySelector(".sheet,.actions,.viewer,.gala")||L.el, overlay:L.el.querySelector(".overlay"), done:()=>c.click()}; }
    if(!ME()) return null;
    const cur=app.querySelector(".screen:not(.under)"); if(!cur) return null;
    if(S.route.length) return {el:cur, page:true, prev:{route:S.route.slice(0,-1),tab:S.tab}, done:()=>back()};
    if(S.tab!=="home") return {el:cur, page:true, prev:{route:[],tab:"home"}, done:()=>setTab("home")};
    return null;
  }
  function makeUnder(prev){
    const top=prev.route[prev.route.length-1]; if(top?.name==="chat") return null;
    const keep={route:S.route,tab:S.tab}; S.route=prev.route; S.tab=prev.tab;
    let html=""; try{ chartSpecs=new Map(); chartSeq=0; html=screenHtml(top); } finally { S.route=keep.route; S.tab=keep.tab; }
    const u=document.createElement("div"); u.className="screen under"; u.innerHTML=html; app.insertBefore(u,app.firstChild);
    const sc=u.querySelector(".scroll[data-key]"); if(sc&&scrollMem[sc.dataset.key]!=null) sc.scrollTop=scrollMem[sc.dataset.key];
    try{ drawCharts(u); }catch{} return u;
  }
  const W=()=>app.clientWidth;
  app.addEventListener("touchstart",e=>{ sw=null; if(e.touches.length!==1) return;
    const x=e.touches[0].clientX-app.getBoundingClientRect().left; if(x>EDGE) return;
    const t=target(); if(!t||!t.el) return; sw={...t,x0:e.touches[0].clientX,y0:e.touches[0].clientY,t0:Date.now(),dx:0,on:false}; },{passive:true});
  app.addEventListener("touchmove",e=>{ if(!sw) return; const p=e.touches[0]; const dx=p.clientX-sw.x0, dy=p.clientY-sw.y0;
    if(!sw.on){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ sw=null; return; } if(dx<8) return;
      sw.on=true; S.swiping=true; sw.el.style.transition="none"; sw.el.classList.add("swiping"); document.activeElement?.blur?.();
      if(sw.page){ sw.under=makeUnder(sw.prev); if(sw.under){ sw.under.style.transition="none"; } } }
    e.preventDefault(); sw.dx=Math.max(0,dx); const f=sw.dx/W();
    sw.el.style.transform=`translateX(${sw.dx}px)`;
    if(sw.under) sw.under.style.transform=`translateX(${-30*(1-f)}%)`;
    if(sw.overlay) sw.overlay.style.opacity=String(Math.max(0,1-f)); },{passive:false});
  function end(){ if(!sw) return; const s=sw; sw=null; if(!s.on) return;
    const v=s.dx/Math.max(1,Date.now()-s.t0); const ok=s.dx>W()*0.35||(v>0.45&&s.dx>50);
    const ease="transform .25s cubic-bezier(.2,.8,.2,1)";
    s.el.style.transition=ease; if(s.under) s.under.style.transition=ease;
    if(s.overlay){ s.overlay.style.transition="opacity .25s"; s.overlay.style.opacity=ok?"0":""; }
    if(ok){ s.el.style.transform=`translateX(${W()}px)`; if(s.under) s.under.style.transform="translateX(0)";
      setTimeout(()=>{ if(s.under){ s.under.remove(); } S.swiping=false; S.renderPending=false; s.done(); },240); }
    else { s.el.style.transform=""; if(s.under) s.under.style.transform="translateX(-30%)";
      setTimeout(()=>{ s.el.style.transition=""; s.el.classList.remove("swiping"); s.under?.remove(); S.swiping=false; if(S.renderPending){ S.renderPending=false; render(); } },260); } }
  app.addEventListener("touchend",end); app.addEventListener("touchcancel",end);
})();

/* ───────────────────────── event photos ───────────────────────── */
async function toPhoto(file,max=1280){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*r); c.height=Math.round(img.naturalHeight*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=.75, out=c.toDataURL("image/jpeg",q); while(out.length>850000&&q>.35){ q-=.1; out=c.toDataURL("image/jpeg",q); } return out; }
  finally{ URL.revokeObjectURL(url); }
}

function galaData(gid){
  const g={id:gid,...S.groups[gid]}; const year=curWeek().slice(0,4); const members=g.members||[];
  const evs=groupEvents(gid).filter(e=>(e.date||"").startsWith(year)&&!isFuture(e));
  const pres=evs.map(e=>({e,p:presentKeys(e).filter(k=>members.includes(k))}));
  const count=f=>{ const c={}; members.forEach(k=>c[k]=0); f(c); return Object.entries(c).map(([k,v])=>({k,v})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v||nm(a.k).localeCompare(nm(b.k))); };
  const attendance=count(c=>pres.forEach(x=>x.p.forEach(k=>c[k]++)));
  const organizers=count(c=>evs.forEach(e=>{ if(e.createdBy in c) c[e.createdBy]++; }));
  const awards=groupAwards(gid);
  const weeks=seasonWeeks();
  const loyalty=count(c=>members.forEach(k=>weeks.forEach(w=>{ if(S.rankings[k]?.weeks?.[w]?.[gid]) c[k]++; const v=S.votes[k]?.weeks?.[w]||{}; if(awards.some(a=>v[a.id])) c[k]++; })));
  const hist=rankingHistory(gid).filter(h=>h.w.startsWith(year));
  const climb=[]; if(hist.length>=2){ members.forEach(k=>{ const firstW=hist.find(h=>h.av.some(a=>a.k===k)); const last=hist[hist.length-1].av.find(a=>a.k===k);
    if(firstW&&last){ const f=firstW.av.find(a=>a.k===k).avg; if(f-last.avg>0.05) climb.push({k,v:f-last.avg,from:f,to:last.avg}); } }); climb.sort((a,b)=>b.v-a.v); }
  let votes=0; members.forEach(k=>Object.entries(S.votes[k]?.weeks||{}).forEach(([w,v])=>{ if(w.startsWith(year)) awards.forEach(a=>{ if(v[a.id]) votes++; }); }));
  let ranks=0; members.forEach(k=>Object.entries(S.rankings[k]?.weeks||{}).forEach(([w,v])=>{ if(w.startsWith(year)&&v[gid]) ranks++; }));
  const best=[...pres].sort((a,b)=>b.p.length-a.p.length)[0];
  const final=averages(gid);
  return {g,year,evs,pres,attendance,organizers,loyalty,climb,awards,votes,ranks,best,final,
    groupEvents:pres.filter(x=>x.p.length>=4).length, presences:pres.reduce((s,x)=>s+x.p.length,0), weeksActive:hist.length};
}

function confetti(cv,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=cv.getBoundingClientRect(); const dpr=devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const cols=["#FFD60A","#FF9F0A","#FF375F","#0A84FF","#30D158","#BF5AF2","#FFFFFF"];
  const ps=Array.from({length:n},()=>({x:r.width/2+(Math.random()-.5)*80,y:r.height*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*6+4,a:Math.random()*6.28,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now(); cancelAnimationFrame(cv._raf);
  const tick=t=>{ c.clearRect(0,0,r.width,r.height); const el=t-t0;
    ps.forEach(p=>{ p.vy+=.22; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; c.save(); c.translate(p.x,p.y); c.rotate(p.a); c.globalAlpha=Math.max(0,1-el/2800); c.fillStyle=p.c; c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); c.restore(); });
    if(el<2800) cv._raf=requestAnimationFrame(tick); else c.clearRect(0,0,r.width,r.height); };
  cv._raf=requestAnimationFrame(tick);
}

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function fbAdapter(fdb){
  const wrapDoc=r=>({id:r.id,path:r.path,get:()=>r.get(),set:d=>r.set(d),update:d=>r.set(d,{merge:true}),delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot(n,e),collection:p=>wrapCol(r.collection(p))});
  const wrapQ=q=>({where:(...a)=>wrapQ(q.where(...a)),orderBy:(...a)=>wrapQ(q.orderBy(...a)),limit:n=>wrapQ(q.limit(n)),get:()=>q.get(),onSnapshot:(n,e)=>q.onSnapshot(n,e)});
  const wrapCol=c=>({...wrapQ(c),path:c.path,doc:id=>wrapDoc(id?c.doc(id):c.doc()),add:async d=>wrapDoc(await c.add(d))});
  return {doc:p=>wrapDoc(fdb.doc(p)),collection:p=>wrapCol(fdb.collection(p))};
}
function fbUnsubAll(){ [...fbSubs,...scopeSubs].forEach(u=>{ try{u();}catch{} }); fbSubs=[]; scopeSubs=[]; fbScopeKey=""; }
function fbSubscribe(){
  const base=["people","groups","votes","rankings"]; const pending=new Set(base);
  const timer=setTimeout(()=>{ S.stale=true; scheduleRender(); },10000);
  base.forEach(c=>fbSubs.push(S.db.collection(c).onSnapshot(snap=>{
    S[c]=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));
    if(pending.delete(c)&&!pending.size){ clearTimeout(timer); S.stale=false; }
    if(!pending.size) fbScope(); scheduleRender();
  }, err=>{ console.warn(c,err); pending.delete(c); if(!pending.size){ clearTimeout(timer); fbScope(); } scheduleRender(); })));
}
/* Group-scoped data: only what the current person may see (security rules check membership per group). */
function fbScope(){
  const me=ME(); const gids=me?Object.entries(S.groups).filter(([,g])=>(g.members||[]).includes(me)).map(([id])=>id).sort():[];
  const key=me+"|"+gids.join(",");
  if(key===fbScopeKey){ S.loaded.add("ready"); return; }
  fbScopeKey=key; scopeSubs.forEach(u=>{ try{u();}catch{} }); scopeSubs=[]; S.events={}; S.awards={}; S.chats={}; S.reads={};
  if(me){
    ["events","awards"].forEach(c=>{ const per={};
      gids.forEach(gid=>scopeSubs.push(S.db.collection(c).where("groupId","==",gid).onSnapshot(s=>{ per[gid]=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); S[c]=Object.assign({},...Object.values(per)); scheduleRender(); }, e=>console.warn(c,gid,e)))); });
    scopeSubs.push(S.db.collection("chats").where("members","array-contains",me).onSnapshot(s=>{ S.chats=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); scheduleRender(); }, e=>console.warn("chats",e)));
    scopeSubs.push(S.db.doc("reads/"+me).onSnapshot(d=>{ S.reads=d.exists?{[me]:d.data()}:{}; scheduleRender(); }, ()=>{}));
  }
  S.loaded.add("ready");
}
async function fbBoot(){
  const v="10.12.2", base=`https://www.gstatic.com/firebasejs/${v}/`;
  try{ await loadScript(base+"firebase-app-compat.js"); await Promise.all([loadScript(base+"firebase-auth-compat.js"),loadScript(base+"firebase-firestore-compat.js")]); }
  catch{ app.querySelector(".screen").innerHTML=`<div class="center"><h2>Sem ligação</h2><p class="muted">Não foi possível carregar a app. Verifica a internet e recarrega a página.</p></div>`; return; }
  try{ navigator.serviceWorker?.register("sw.js").catch(()=>{}); }catch{}
  firebase.initializeApp(FBCFG); const fdb=firebase.firestore(); S.raw=fdb; S.db=fbAdapter(fdb); S.fb=true;
  S.auth=firebase.auth(); S.auth.languageCode="pt";
  S.auth.onAuthStateChanged(async u=>{
    fbUnsubAll(); S.loaded.clear(); COLS.forEach(c=>S[c]={}); S.route=[]; S.localVotes={};
    S.authKnown=true;
    if(!u){ S.uid=null; S.isOwner=false; render(); return; }
    S.uid=u.uid; S.email=u.email; render();
    try{ const ref=fdb.doc("config/app"); let c=await ref.get(); if(!c.exists){ try{ await ref.set({ownerUid:u.uid,createdAt:Date.now()}); c=await ref.get(); }catch{} }
      S.isOwner=!!(c.exists&&c.data().ownerUid===u.uid); }catch{ S.isOwner=false; }
    if(!S.isOwner){ S.actingAs=null; }
    fbSubscribe();
  });
}
function authScreen(){
  const m=S.authMode||"login";
  return `<div class="scroll pad-bottom" data-key="auth"><div class="section" style="margin-top:calc(var(--st) + 40px);max-width:440px;margin-left:auto;margin-right:auto">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:26px">
      <div class="logo big">${LOGO}</div><h1 style="font-family:var(--display);font-size:34px;font-weight:700">Pês</h1>
      <p class="muted">Bem-vindo ao mundo dos Lifes.</p></div>
    ${m!=="reset"?`<div class="seg" style="margin-bottom:14px"><button data-act="authMode" data-arg="login" class="${m==="login"?"on":""}">Entrar</button><button data-act="authMode" data-arg="register" class="${m==="register"?"on":""}">Criar conta</button></div>`:""}
    <form class="card pad" id="authForm" style="display:flex;flex-direction:column;gap:14px" novalidate>
      ${m==="reset"?`<h2 style="font-size:20px;font-weight:700">Recuperar password</h2><p class="small muted">Enviamos-te um email com um link para escolheres uma password nova.</p>`:""}
      <div class="field"><label for="aemail">Email</label><input id="aemail" class="input" type="email" autocomplete="email" placeholder="o.teu@email.com" value="${esc(S.authEmail||"")}"></div>
      ${m!=="reset"?`<div class="field" style="margin-top:0"><label for="apw">Password</label><input id="apw" class="input" type="password" autocomplete="${m==="login"?"current-password":"new-password"}" placeholder="${m==="login"?"A tua password":"Pelo menos 6 caracteres"}"></div>`:""}
      ${m==="register"?`<div class="field" style="margin-top:0"><label for="apw2">Repetir password</label><input id="apw2" class="input" type="password" autocomplete="new-password" placeholder="Escreve outra vez"></div>`:""}
      <p class="hint" id="aerr" style="color:var(--red);margin:0" role="alert"></p>
      <button class="btn block" type="submit">${m==="login"?"Entrar":m==="register"?"Criar conta":"Enviar email"}</button>
      ${m==="login"?`<button type="button" class="linkbtn" data-act="authMode" data-arg="reset">Esqueci-me da password</button>`:""}
      ${m==="reset"?`<button type="button" class="linkbtn" data-act="authMode" data-arg="login">Voltar a entrar</button>`:""}
    </form></div></div>`;
}
const AUTH_ERR={"auth/invalid-email":"Esse email não parece válido.","auth/missing-password":"Escreve a password.","auth/invalid-credential":"Email ou password errados.","auth/wrong-password":"Email ou password errados.","auth/user-not-found":"Não existe conta com esse email.","auth/email-already-in-use":"Já existe uma conta com esse email. Entra em vez de criar.","auth/weak-password":"A password tem de ter pelo menos 6 caracteres.","auth/too-many-requests":"Demasiadas tentativas. Espera uns minutos.","auth/network-request-failed":"Sem ligação à internet."};
document.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm") return; e.preventDefault();
  const m=S.authMode||"login"; const email=document.getElementById("aemail").value.trim(); S.authEmail=email;
  const pw=document.getElementById("apw")?.value||""; const err=document.getElementById("aerr"); const btn=e.target.querySelector('[type=submit]');
  if(m==="register"&&pw!==document.getElementById("apw2").value){ err.textContent="As passwords não são iguais."; return; }
  btn.disabled=true; err.textContent="";
  try{
    if(m==="login") await S.auth.signInWithEmailAndPassword(email,pw);
    else if(m==="register") await S.auth.createUserWithEmailAndPassword(email,pw);
    else { await S.auth.sendPasswordResetEmail(email); S.authMode="login"; render(); toast("Email enviado. Vê também o spam."); return; }
  } catch(x){ err.textContent=AUTH_ERR[x.code]||"Não foi possível continuar. Tenta outra vez."; btn.disabled=false; }
});
async function fbCreateProfile(name){
  const key=slug(name)+"-"+Math.random().toString(36).slice(2,6); const b=S.raw.batch();
  b.set(S.raw.doc("people/"+key),{name,uid:S.uid,photo:null,createdAt:Date.now()}); b.set(S.raw.doc("uids/"+S.uid),{key}); await b.commit();
}
async function fbClaim(k){ const b=S.raw.batch(); b.set(S.raw.doc("people/"+k),{uid:S.uid},{merge:true}); b.set(S.raw.doc("uids/"+S.uid),{key:k}); await b.commit(); }
async function fbRelease(k){ const uid=S.people[k]?.uid; const b=S.raw.batch(); b.set(S.raw.doc("people/"+k),{uid:null},{merge:true}); if(uid) b.delete(S.raw.doc("uids/"+uid)); await b.commit(); }

/* ───────────────────────── boot ───────────────────────── */
function subscribeAll(){
  let pending=new Set(COLS);
  const timer=setTimeout(()=>{ S.stale=true; scheduleRender(); },10000);
  COLS.forEach(c=>{
    S.db.collection(c).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S[c]=o;
      if(!snap.metadata?.fromCache && pending.delete(c) && !pending.size){ clearTimeout(timer); S.stale=false; S.loaded.add("ready"); }
      if(snap.metadata?.fromCache===false||S.loaded.has("ready")) scheduleRender();
      if(!S.loaded.has("ready") && pending.size===0){ S.loaded.add("ready"); }
    }, err=>{ pending.delete(c); if(!pending.size){ clearTimeout(timer); S.loaded.add("ready"); } scheduleRender(); });
  });
}
async function boot(){
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{ applyTheme(); scheduleRender(); });
  new MutationObserver(()=>{ applyTheme(); scheduleRender(); }).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  window.addEventListener("resize",()=>scheduleRender());
  if (FBCFG){ render(); fbBoot(); return; }
  let db=null, user=null;
  if (window.claude?.use){ [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]); }
  if (db){
    S.db=db; S.uid=user?await user.id():null; S.isOwner=user?await user.isOwner():false;
    if(!S.uid){ app.querySelector(".screen").innerHTML=`<div class="center"><div class="logo big">${LOGO}</div><h2>Inicia sessão no Claude</h2><p class="muted" style="max-width:30ch">Abre esta app com a tua conta Claude para poderes entrar.</p></div>`; return; }
    subscribeAll();
  } else {
    S.preview=true; S.db=MemDB(generateDemo(Date.now())); S.uid="preview"; S.isOwner=true;
    await S.db.doc("people/goncalo-xavier").update({uid:"preview"});
    subscribeAll();
  }
  render();
}
boot();
