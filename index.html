<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="pes-version" content="1795796463">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pês">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>Pês</title>
<style>
/* Pês — Apple-style minimal: neutral greys, one blue accent, system type. Mobile column centred on wide screens. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --text:#000000; --muted:#8A8A8E;
  --border:#E3E3E8; --accent:#007AFF; --accent-soft:#E8F1FF; --on-accent:#FFFFFF;
  --green:#28A745; --green-soft:#E6F6EA; --red:#E5352B; --red-soft:#FDECEB; --orange:#F08C00; --gold:#E3A000;
  --overlay:rgba(0,0,0,.38); --shadow:0 10px 30px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:16px; --r-sm:12px; --gut:20px;
  --tabh:58px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-pes="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --text:#FFFFFF; --muted:#98989F;
    --border:#38383A; --accent:#0A84FF; --accent-soft:#0F2741; --on-accent:#FFFFFF;
    --green:#32D74B; --green-soft:#0F2E17; --red:#FF453A; --red-soft:#3A1412; --orange:#FF9F0A; --gold:#FFD60A;
    --overlay:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-pes="light"]), :root[data-pes="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --text:#FFFFFF; --muted:#98989F;
  --border:#38383A; --accent:#0A84FF; --accent-soft:#0F2741; --on-accent:#FFFFFF;
  --green:#32D74B; --green-soft:#0F2E17; --red:#FF453A; --red-soft:#3A1412; --orange:#FF9F0A; --gold:#FFD60A;
  --overlay:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input,textarea,select{font:inherit;color:var(--text)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:560px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.under{z-index:0;pointer-events:none}
.screen.swiping{z-index:1;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.sheet.swiping,.viewer.swiping,.gala.swiping{box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.sttap{position:absolute;left:0;right:0;top:0;height:max(var(--st),0px);z-index:40}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad-tabs{padding-bottom:calc(var(--tabh) + var(--sb) + 28px)}
.pad-bottom{padding-bottom:calc(var(--sb) + 28px)}

/* Headers — one system for the whole app */
.tabhead{padding:calc(var(--st) + 14px) calc(var(--gut) + var(--sr)) 10px calc(var(--gut) + var(--sl));display:flex;align-items:flex-end;gap:12px}
.tabhead .titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tabhead h1{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.6px}
.navhead{position:relative;z-index:2;flex:none;padding:calc(var(--st) + 8px) calc(14px + var(--sr)) 10px calc(14px + var(--sl));display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;background:var(--bg);border-bottom:.5px solid var(--border)}
.navhead h2{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navtitle{min-width:0;border-radius:10px;padding:2px 4px}
.navtitle:hover h2{opacity:.8}
.navhead .sub{display:block;font-size:12px;font-weight:400;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roundbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--accent);flex:none}
.roundbtn.fill{background:var(--accent);color:var(--on-accent)}
.roundbtn svg{width:19px;height:19px}

/* Sections & cards */
.section{padding:0 calc(var(--gut) + var(--sr)) 0 calc(var(--gut) + var(--sl));margin-top:22px}
.hojehead{align-items:center;gap:12px}.hojeme{border:0;background:none;padding:0;cursor:pointer;flex:none;border-radius:50%}
.gapbtn{position:relative}.gapbtn .badge{position:absolute;top:-4px;right:-4px}
.nowlist{display:flex;flex-direction:column;gap:12px}.nowlist>.section{margin:0!important}
.nowcard{width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;padding:16px;font:inherit;color:var(--text);text-align:left;cursor:pointer;background:var(--card)}
.nowcard b{display:block;font-size:16.5px}.nowcard small{display:block;font-size:13.5px;color:var(--muted)}.nowcard .grow{min-width:0}.nowcard>svg{width:18px;height:18px;color:var(--muted);flex:none}
.nc-ico{font-size:30px;line-height:1;flex:none;width:40px;text-align:center}.nowcard.ngala{background:linear-gradient(135deg,#1f4d3a,#5a1f1f);color:#fff}.nowcard.ngala small{color:rgba(255,255,255,.8)}
.dtile.c7{background:linear-gradient(135deg,#ff9f0a,#ff375f)}.dtile.c8{background:#3d5a99}
.tab.hometab.due .hbub{animation:votepulse 2s ease-in-out infinite}@keyframes votepulse{0%,100%{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 25%,transparent)}}
.csgrp{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}.csg-h{width:100%;border:0;background:none;color:var(--text);font:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.csg-e{font-size:22px;width:28px;text-align:center}.csg-l{flex:1;font-weight:600;font-size:16px}.csg-n{font-size:13px;font-weight:700;color:var(--muted);background:var(--card2);border-radius:10px;padding:2px 9px}.csg-h>svg{width:16px;height:16px;color:var(--muted);transition:transform .2s;flex:none}.csgrp.open .csg-h>svg{transform:rotate(90deg)}.csgrp .csg-body{display:none}.csgrp.open .csg-body{display:block}
.csg-body{padding:0 10px 10px}.csg-body .csitem{background:var(--card2)}.csg-body .card.list{background:var(--card2)}
.csitem{margin-bottom:10px}.cs-tag{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.ctabs button{position:relative}.cbadge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.dt-new{display:inline-block;vertical-align:middle;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#fff;color:#ff375f;border-radius:8px;padding:2px 7px;margin-left:4px}
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dtile{position:relative;overflow:hidden;aspect-ratio:1.55/1;border:0;border-radius:14px;padding:14px;text-align:left;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.dtile:active{transform:scale(.97)}
.dt-t{font-size:18px;font-weight:800;line-height:1.15;letter-spacing:-.2px;max-width:85%;position:relative;z-index:1}.dt-s{font-size:13px;opacity:.9;position:relative;z-index:1;font-weight:600;max-width:72%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dt-art{position:absolute;right:-10px;bottom:-10px;width:68px;height:68px;transform:rotate(22deg);border-radius:10px;display:grid;place-items:center;background:rgba(0,0,0,.25);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.dt-art img{width:86%;height:86%;object-fit:contain}.dt-emo{font-size:40px;line-height:1}
.dtile.c1{background:#4f7a91}.dtile.c2{background:linear-gradient(135deg,#8e3bd6,#2c6cf0)}.dtile.c3{background:#6b4423}.dtile.c4{background:#b0457f}.dtile.c5{background:#2e7d5b}.dtile.c6{background:#2a3566}
.dtile.locked{filter:saturate(.35) brightness(.7)}.dt-lock{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center}.dt-lock svg{width:15px;height:15px;color:#ffd60a}
.row>svg:last-child{width:18px;height:18px;flex:none;color:var(--muted)}
.dsec{margin-top:28px}.dhead{display:flex;align-items:center;gap:9px;margin:0 4px 12px}.dhead h3{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.2px}.dh-emo{font-size:22px;line-height:1;width:28px;text-align:center;flex:none}.dh-pf{width:30px;height:30px;object-fit:contain;margin:-4px 0}
.dhead button{font-size:15px;font-weight:500;color:var(--accent);background:none;border:0;padding:4px;cursor:pointer;font-family:inherit}
.dsub-l{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px;display:flex;justify-content:space-between;align-items:center}.dsub-l:first-child{margin-top:0}.dsub-l button{font-size:13px;font-weight:500;color:var(--accent);text-transform:none;letter-spacing:0;background:none;border:0;cursor:pointer;font-family:inherit}
.dsec .card.list+.card.list{margin-top:0}
.label{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:0 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label button{font-size:13px;font-weight:500;color:var(--accent);text-transform:none;letter-spacing:0}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.card.pad{padding:16px}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;position:relative;width:100%;text-align:left}
.list .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--border)}
.list .row .grow{flex:1;min-width:0}
.rowtitle{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowsub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .ico{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.empty .ico svg{width:22px;height:22px}
.empty h3{font-size:17px;font-weight:600}
.empty p{font-size:14px;color:var(--muted);max-width:30ch}

/* Buttons */
.btn{height:48px;border-radius:14px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn.secondary{background:var(--card);color:var(--accent)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btnrow{display:flex;gap:12px}
.btnrow .btn{flex:1;min-width:0;padding:0 10px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;align-self:flex-start;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{width:12px;height:12px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.grey{background:var(--card2);color:var(--muted)}
.chip svg{width:11px;height:11px}
.linkbtn{color:var(--accent);font-weight:500;font-size:15px}
.minibtn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.minibtn svg{width:13px;height:13px}
.iconbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}

/* Avatars */
.av{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;overflow:hidden;color:#fff;background:var(--muted);user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.stack{display:flex;align-items:center}
.stack .av{box-shadow:0 0 0 2px var(--card)}
.stack .av+.av{margin-left:-9px}
.stack .more{background:var(--accent-soft);color:var(--accent)}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);padding:6px var(--sr) calc(var(--sb) + 4px) var(--sl);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--border)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--muted);height:48px;justify-content:center;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab.hometab{color:#fff}
.tab.hometab .hbub{flex:none;width:50px;height:50px;min-width:50px;min-height:50px;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;margin-top:-26px;box-sizing:border-box;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent),0 1px 3px rgba(0,0,0,.25)}
.tab.hometab .hbub svg{width:24px;height:24px;display:block}
.tab.hometab span:last-child{color:var(--muted)}
.tab.hometab.on span:last-child{color:var(--accent);font-weight:600}
.tab.hometab .badge{top:-26px;left:calc(50% + 12px)}
.gline{display:flex;align-items:center;gap:8px;min-width:0}
.seasonpill{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px 0 10px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.seasonpill svg{width:14px;height:14px}
.seasonpill.past{background:var(--gold);color:#3a2a00}
.pastbanner{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--text)}
.pastbanner span{flex:1}
.pastbanner button{flex:none;font-size:13px;font-weight:600;color:var(--accent);padding:4px 2px}
.tabhead .titles .gname{font-family:inherit;line-height:1.2;letter-spacing:0;font-size:15px;font-weight:600;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.4px}
.stat .k{font-size:12px;font-weight:600;line-height:1.2}
.stat .s{font-size:11px;color:var(--muted);line-height:1.2}
.stat.cta{background:var(--accent);color:var(--on-accent);text-align:left;grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;min-height:0;padding:14px 16px}
.stat.cta .k{font-size:13px}
.stat.cta .s{color:color-mix(in srgb,var(--on-accent) 80%,transparent)}
.stat.cta svg{width:20px;height:20px}
.stat.done{background:var(--card);color:var(--text)}
.stat.done svg{color:var(--green)}
.stat.done .s{color:var(--muted)}

.bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.rank{width:26px;text-align:center;font-weight:700;font-size:14px;color:var(--muted);flex:none}
.rank.gold{color:var(--gold)}

/* Events */
.ev{display:flex;gap:14px;padding:14px 16px}
.datebox{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--card2);padding:6px 0}
.datebox b{display:block;font-size:19px;font-weight:700;line-height:1.1}
.datebox span{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--red)}
.ev h3{font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ev .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.ev .desc{font-size:14px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.place{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;max-width:100%}
.place svg{width:14px;height:14px;flex:none}.place span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--orange);color:#fff;font-size:14px}
.soon svg{width:18px;height:18px;flex:none;margin-top:1px}.soon a{display:block;color:#fff;opacity:.9;font-size:13px;margin-top:2px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos button{aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--card2);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .bar2{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 10px) 16px 10px;color:#fff;font-size:14px}
.viewer .bar2 button{color:#fff;font-size:16px}
.presence{border-top:.5px solid var(--border);padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
.presence .q{font-size:12px;font-weight:500;color:var(--muted)}
.seg2{display:flex;gap:10px}
.seg2 button{flex:1;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card2);font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg2 button svg{width:15px;height:15px}
.seg2 button.yes{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.seg2 button.no{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.notice{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.notice .n{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Journey */
.votechip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);width:100%;text-align:left;font-size:15px;font-weight:500;color:var(--muted)}
.votechip.set{border-color:var(--accent);color:var(--accent)}
.votechip.local{background:var(--accent-soft)}
.votechip .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.votechip svg{width:16px;height:16px;flex:none}
.dots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--on-accent)}
.dot.on{background:var(--accent)}
.dot svg{width:12px;height:12px}
.floatbar{position:absolute;left:0;right:0;bottom:calc(var(--tabh) + var(--sb) + 10px);z-index:4;padding:0 calc(var(--gut) + var(--sr)) 0 calc(var(--gut) + var(--sl))}
.floatbar .btn{box-shadow:var(--shadow)}
.award{display:flex;align-items:center;gap:10px}
.award .emo{font-size:24px;line-height:1;width:30px;text-align:center;flex:none}
.award h3{font-size:17px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.toggle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px 0;font-size:13px;font-weight:500;color:var(--muted)}
.toggle svg{width:14px;height:14px}

/* Home */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--card);display:grid;place-items:center;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.logo svg{width:32px;height:32px}
.logo.big{width:84px;height:84px;border-radius:22px}
.logo.big svg{width:58px;height:58px}
.brand b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.3px}
.hello{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:22px;text-align:center}
.hello p{font-size:14px;color:var(--muted)}
.hello h2{font-family:var(--display);font-size:24px;font-weight:700}
.gcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px}
.gcard+.gcard{margin-top:12px}
.gtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gcard{cursor:pointer;-webkit-tap-highlight-color:transparent}
.gcard:active{transform:scale(.99)}
.gside{display:flex;align-items:center;gap:8px;flex:none}
.gcount{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--red);color:#fff!important;font-size:12px;font-weight:700;display:grid;place-items:center}
.ginfo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.ginfo svg{width:20px;height:20px}
.gnotes{font-size:13px;color:var(--red);font-weight:500;margin:-4px 0 12px}
.gfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gphoto{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none}
.gphoto img{width:100%;height:100%;object-fit:cover}
.gphoto svg{width:24px;height:24px}

/* Chat */
.chatrow .dotu{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.msgs{padding:12px 14px 8px;display:flex;flex-direction:column;gap:2px}
.day{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);padding:4px 10px;border-radius:10px;margin:12px 0 8px}
.m{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.m.me{justify-content:flex-end}
.m .col{display:flex;flex-direction:column;max-width:76%;min-width:0}
.m.me .col{align-items:flex-end}
.m .who{font-size:12px;color:var(--muted);margin:6px 0 2px 12px}
.bub{padding:8px 13px;border-radius:18px;background:var(--card);font-size:16px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me .bub{background:var(--accent);color:var(--on-accent)}
.m .t{font-size:11px;color:var(--muted);margin:3px 8px 6px}
.m .avs{width:28px;flex:none}
.bub{cursor:pointer;-webkit-user-select:none;user-select:none;transition:box-shadow .3s}
.bub.flash{box-shadow:0 0 0 3px var(--gold)}
.rq{display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:100%;margin:2px 0 -6px;padding:6px 12px 12px;border-radius:14px 14px 4px 4px;background:color-mix(in srgb,var(--card) 60%,transparent);border-left:3px solid var(--accent);font-size:13px;color:var(--muted)}
.m.me .rq{align-items:flex-end;text-align:right;border-left:0;border-right:3px solid var(--accent)}
.rq b{color:var(--accent);font-weight:600;font-size:12px}
.rq .rqt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:240px}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin:-6px 6px 0;position:relative;z-index:1}
.m.me .rx{justify-content:flex-end}
.rxc{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 7px;border-radius:12px;background:var(--card);border:1.5px solid var(--bg);font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rxc small{font-size:11px;color:var(--muted);font-weight:600}
.rxc.mine{border-color:var(--accent);background:var(--accent-soft)}
.msgmenu .rxpick{display:flex;justify-content:space-around;padding:8px 6px}
.msgmenu .rxpick button{font-size:28px;width:46px;height:46px;border-radius:50%;padding:0;justify-content:center;border:0}
.msgmenu .rxpick button.sel{background:var(--accent-soft)}
.msgmenu .grp button{display:flex;align-items:center;gap:10px}
.msgmenu .grp button svg{width:20px;height:20px}
.replybar[hidden]{display:none}
.replybar{display:flex;align-items:center;gap:10px;margin:0 12px;padding:8px 10px 8px 12px;border-radius:14px 14px 0 0;background:var(--card);border-left:3px solid var(--accent)}
.replybar .rbt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.replybar .rbt b{color:var(--accent);font-weight:600}
.replybar .rbt span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.replybar button svg{width:16px;height:16px}
.composer{flex:none;display:flex;align-items:flex-end;gap:10px;padding:8px calc(14px + var(--sr)) calc(var(--sb) + 8px) calc(14px + var(--sl));background:var(--bg);border-top:.5px solid var(--border)}
.composer textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--card);border-radius:20px;padding:9px 14px;min-height:40px;max-height:120px;line-height:1.35;font-size:16px;outline:none}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.composer .send:disabled{background:var(--card2);color:var(--muted);opacity:1}
.composer .send svg{width:18px;height:18px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field+.field{margin-top:16px}
.field label,.flabel{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-left:4px}
.input{width:100%;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:0 14px;font-size:16px;outline:none}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--accent)}
.code{letter-spacing:6px;text-align:center;font-size:22px;font-weight:600;text-transform:uppercase}
.hint{font-size:13px;color:var(--muted);margin:2px 4px 0}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Sheets, dialogs, toasts */
.layer{position:absolute;inset:0;z-index:20}
.overlay{position:absolute;inset:0;background:var(--overlay);animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--st) + 14px);background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet.short{top:auto;max-height:calc(100% - var(--st) - 14px)}
.sheethead{flex:none;display:grid;grid-template-columns:minmax(72px,auto) 1fr minmax(72px,auto);align-items:center;gap:8px;padding:12px 16px;border-bottom:.5px solid var(--border);background:var(--bg)}
.sheethead h2{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheethead .l{justify-self:start;color:var(--accent);font-size:16px;font-weight:400}
.sheethead .r{justify-self:end;color:var(--accent);font-size:16px;font-weight:600}
.sheethead .r:disabled{color:var(--muted);opacity:1}
.sheetbody{flex:1;overflow-y:auto;padding:20px calc(var(--gut) + var(--sr)) calc(var(--sb) + 28px) calc(var(--gut) + var(--sl))}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,calc(100% - 48px));background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);animation:pop .18s ease}
.dialog .dt{padding:20px 18px 16px;text-align:center}
.dialog h3{font-size:17px;font-weight:600}
.dialog p{font-size:14px;color:var(--muted);margin-top:6px}
.dialog .db{display:flex;border-top:.5px solid var(--border)}
.dialog .db button{flex:1;height:46px;font-size:16px;color:var(--accent)}
.dialog .db button+button{border-left:.5px solid var(--border);font-weight:600}
.dialog .db button.danger{color:var(--red)}
.actions{position:absolute;left:8px;right:8px;bottom:calc(var(--sb) + 8px);display:flex;flex-direction:column;gap:8px;animation:up .25s ease;max-width:504px;margin:0 auto}
.actions .grp{background:var(--card);border-radius:14px;overflow:hidden}
.actions .grp:first-child{max-height:calc(100dvh - var(--st) - var(--sb) - 110px);overflow-y:auto;overscroll-behavior:contain}
.actions .ttl{position:sticky;top:0;background:var(--card);z-index:1}
.actions .ttl{padding:12px 16px;text-align:center;font-size:13px;color:var(--muted);border-bottom:.5px solid var(--border)}
.actions .grp button{width:100%;min-height:54px;padding:8px 16px;font-size:16px;line-height:1.25;text-align:center;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px}
.actions .grp button+button{border-top:.5px solid var(--border)}
.actions .grp button.danger{color:var(--red)}
.actions .grp button.sel{font-weight:600}
.actions .cancel{font-weight:600}
.toast{position:absolute;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);z-index:40;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:pop .2s ease;max-width:calc(100% - 40px);text-align:center}
.banner{margin:0 calc(var(--gut) + var(--sr)) 0 calc(var(--gut) + var(--sl));padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}
.banner svg{width:16px;height:16px;flex:none}
.banner.warn{background:var(--red-soft);color:var(--red)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.96)}to{opacity:1}}
.toast{animation:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.switch{width:44px;height:26px;border-radius:13px;background:var(--card2);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--green)}.switch.on i{transform:translateX(18px)}
.row:disabled .switch{opacity:.5}
.galabanner{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#1b1640,#3a1d5c 55%,#7a4a00);box-shadow:var(--shadow)}
.lockcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 18px;width:100%;color:var(--muted);font-size:14px}
.lockcard>svg{width:30px;height:30px;color:var(--gold)}
.lockcard b{color:var(--text);font-size:17px;font-weight:700}
.keepin{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;margin:2px 2px 0;-webkit-tap-highlight-color:transparent}
.keepin input{position:absolute;opacity:0;pointer-events:none}
.keepin .kbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s}
.keepin .kbox svg{width:15px;height:15px}
.keepin input:checked+.kbox{background:var(--accent);border-color:var(--accent);color:#fff}
.keepin input:focus-visible+.kbox{outline:2px solid var(--accent);outline-offset:2px}
.chatwrap{display:flex;align-items:center}
.chatwrap .chatrow{flex:1;min-width:0}
.chatdel{flex:none;width:30px;height:30px;margin-left:14px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.chatdel svg{width:16px;height:16px}
.rcount{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;flex:none}
.rcount b{font-size:20px;font-weight:700}
.rcount small{font-size:11px;opacity:.75}
.ws-head{text-align:center;margin:-6px 0 14px}
.ws-head .ws-emo{font-size:40px;line-height:1}
.ws-head h2{font-size:24px;font-weight:800;margin:6px 0 2px}
.ws-head p{color:var(--muted);margin:0;font-size:14px}
.ws-part{margin:0 2px 16px;font-size:14px;color:var(--muted)}
.ws-part b{color:var(--text)}
.ws-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-bottom:6px}
.ws-bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ws-tile{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;position:relative}
.ws-tile b{font-size:28px;font-weight:800;line-height:1.1}
.ws-tile span{font-weight:600;font-size:14px}
.ws-tile small{color:var(--muted);font-size:12px}
.ws-tile .ws-up,.ws-tile .ws-down,.ws-tile .ws-eq{position:absolute;top:12px;right:12px;font-size:13px}
.ws-up{color:var(--green);font-weight:700}
.ws-down{color:var(--red);font-weight:700}
.ws-eq{color:var(--muted);font-weight:700}
.ws-moves{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ws-move{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.ws-move div{display:flex;flex-direction:column;min-width:0}
.ws-move b{font-size:15px}
.ws-move small{color:var(--muted);font-size:12px}
.ws-future .row{opacity:.85}
.ws-fe{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:17px;flex:none}
.wsbanner{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;text-align:left;color:#fff;
  background:linear-gradient(135deg,#5b5bf0 0%,#007AFF 55%,#14b8d4 100%);box-shadow:0 6px 18px color-mix(in srgb,#007AFF 30%,transparent)}
.wsbanner:active{transform:scale(.99)}
.wsb-ico{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;flex:none}
.wsb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.wsb-txt b{font-size:17px;font-weight:700}
.wsb-txt small{font-size:13px;opacity:.85;margin-top:1px}
.wsbanner>svg{width:20px;height:20px;opacity:.85;flex:none}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left}
.rowbtn .grow{min-width:0}
.rowbtn .rowsub{white-space:normal}
.story{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;background:linear-gradient(165deg,var(--s1,#5B2BE0) 0%,var(--s2,#1A0B4D) 100%);transition:background .4s;
  --muted:rgba(255,255,255,.72);--border:rgba(255,255,255,.16);--card:rgba(255,255,255,.12);--card2:rgba(255,255,255,.08);--text:#fff;--accent:#FFD60A;--accent-soft:rgba(255,255,255,.16);color-scheme:dark;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sbars{display:flex;gap:4px;padding:calc(var(--st) + 10px) 12px 0}
.sbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.sbars b{display:block;height:100%;width:0;background:#fff}
.shead{display:flex;align-items:center;gap:10px;padding:10px 14px 2px}.shead .s-g{flex:1;font-size:13px;font-weight:700}.shead .s-g span{font-weight:500;opacity:.75}
.shead .gclose{background:rgba(255,255,255,.16)}
.sstage{flex:1;overflow-y:auto;display:flex;cursor:pointer;padding-bottom:env(safe-area-inset-bottom)}
.sstep{margin:auto;width:100%;max-width:460px;padding:12px 20px 30px;display:flex;flex-direction:column;gap:14px;animation:gin .4s ease}
.s-emo{font-size:56px;line-height:1;text-align:center}.s-title{font-family:var(--display);text-align:center;font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.4px}
.s-sub{text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}.s-txt{text-align:center;color:var(--muted);font-size:14px;margin:0}
.story .ws-part{margin:0}.story .ws-bar{background:rgba(255,255,255,.2)}.story .card{background:var(--card)}
.s-lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 18px;border-radius:20px;background:rgba(0,0,0,.22);margin-top:6px}
.s-lock .s-lemo{font-size:34px;line-height:1}.s-lock b{font-size:20px;font-weight:800}.s-lock p{margin:0;font-size:15px;line-height:1.45;color:#E8E6F5;max-width:320px}
.s-lock .btn{height:44px;padding:0 18px}
.story.paused .sstep{opacity:.92}
.story .ws-up{color:#5CF09A}.story .ws-down{color:#FF9BAA}.story .ws-eq{color:rgba(255,255,255,.7)}
.pfcard.locked{opacity:.75}
.qtop{display:flex;flex-direction:column;gap:6px;width:100%}.qtp{display:flex;align-items:center;gap:8px}.qmed{font-size:17px;width:22px;flex:none;text-align:center}
.qwho{flex:1;display:flex;flex-wrap:wrap;gap:6px 12px;min-width:0}.qwho>span{display:inline-flex;align-items:center;gap:6px}.qtp small{color:var(--muted);font-size:12px;flex:none}.qtp.p1 b{font-weight:800}.qtp.p2 b,.qtp.p3 b{font-weight:600}
.ws-tease{position:relative}
.ws-blur{filter:blur(7px);opacity:.75;pointer-events:none;user-select:none}
.ws-tease .ws-grid{min-height:300px;grid-auto-rows:1fr}
.ws-joke{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:6px;border-radius:20px;background:color-mix(in srgb,var(--card) 82%,transparent);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.ws-joke .ws-jemo{font-size:34px;line-height:1}
.ws-joke b{font-size:20px;font-weight:800}
.ws-joke p{font-size:15px;max-width:300px;margin:0}
.ws-joke .btn{height:44px;padding:0 18px}
.ws-joke small{color:var(--muted);font-size:12px;margin-top:4px}
.achcard{display:flex;flex-direction:column;gap:14px;width:100%;padding:16px;text-align:left}
.achtop{display:flex;gap:16px;align-items:center}
.achinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.achinfo small{color:var(--muted);font-size:12px}
.achinfo b{font-size:17px;font-weight:700}
.achinfo span{font-size:13px;color:var(--muted)}
.achinfo .ach-bar{margin-top:4px}
.ach-ring{position:relative;flex:none;display:grid;place-items:center}
.ach-ring svg{position:absolute;inset:0}
.ach-ring span{font-size:20px;font-weight:800;position:relative}
.ach-ring small{font-size:12px;color:var(--muted);font-weight:600}
.achstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.achstrip::-webkit-scrollbar{display:none}

function MemDB(initial){
  const data=new Map(Object.entries(initial||{})); const subs=new Set();

  const docRef=path=>({id:path.split("/").pop(),path,
    get:async()=>snap(path.split("/").pop(),data.get(path)),
    set:async v=>{ data.set(path,JSON.parse(JSON.stringify(v))); notify(); },
    update:async v=>{ if(!data.has(path)) throw {code:"invalid_argument"}; data.set(path,merge(data.get(path),JSON.parse(JSON.stringify(v)))); notify(); },
    delete:async()=>{ data.delete(path); notify(); },
    acquire:async()=>({acquired:true}),
    onSnapshot:(next)=>{ const f=()=>next(snap(path.split("/").pop(),data.get(path))); subs.add(f); f(); return ()=>subs.delete(f); },
    collection:p=>colRef(path+"/"+p)});
  const colRef=(path,q={})=>{ const run=()=>{ const depth=path.split("/").length+1; let docs=[...data.entries()].filter(([p])=>p.startsWith(path+"/")&&p.split("/").length===depth).map(([p,d])=>snap(p.split("/").pop(),d));
      (q.w||[]).forEach(([f,op,v])=>{ docs=docs.filter(s=>{ const x=s.data()[f]; return op==="=="?x===v:op==="array-contains"?(x||[]).includes(v):true; }); });
      if(q.o){ const [f,dir]=q.o; docs.sort((a,b)=>((a.data()[f]>b.data()[f])?1:-1)*(dir==="desc"?-1:1)); }
      if(q.l) docs=docs.slice(0,q.l); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}}; };
    return {path,doc:id=>docRef(path+"/"+(id||uidGen())),add:async v=>{ const r=docRef(path+"/"+uidGen()); await r.set(v); return r; },
      where:(f,op,v)=>colRef(path,{...q,w:[...(q.w||[]),[f,op,v]]}),orderBy:(f,d)=>colRef(path,{...q,o:[f,d]}),limit:n=>colRef(path,{...q,l:n}),
      get:async()=>run(),onSnapshot:next=>{ const f=()=>next(run()); subs.add(f); f(); return ()=>subs.delete(f); }}; };
  return {doc:docRef,collection:p=>colRef(p)};
}

function averages(gid, uptoWeek=lastClosedWeek(), s=viewSeason(gid)){

    const weeks=S.rankings[r]?.weeks||{}; const ks=Object.keys(weeks).filter(w=>w<=uptoWeek && inSeasonW(s,w) && weeks[w]?.[gid]).sort();
    if(!ks.length) return; const rk=weeks[ks[ks.length-1]][gid];

  const pts=m+r+g+3*evC; parts.push({w:20,label:"💬 Conversa e eventos",v:Math.min(1,pts/(4*n)),d:`${m} mensagens, ${r} reações, ${g} palpites, ${evC} eventos criados`});

function activityScore(gid,k){ const p=activityParts(gid,k); const W=p.reduce((a,x)=>a+x.w,0)||1; return Math.round(100*p.reduce((a,x)=>a+x.w*x.v,0)/W); }
/* ───────── Seasons: each season ends on the group's gala day; the next one starts the day after ─────────

const inSeasonW=(s,w)=>(!s.startW||w>=s.startW)&&(!s.endW||w<=s.endW);

let chartSpecs=new Map(); let chartSeq=0;

/* Time charts: points carry a week key (p.w); the x axis spans spec.from..spec.to (week keys) by real dates. */
const WEEKMS=7*864e5;
function chartTicksX(t0,t1,W){
  const span=(t1-t0)/WEEKMS; const maxL=Math.max(3,Math.floor(W/62)); let ticks=[];
  const y0=new Date(t0+6*864e5).getUTCFullYear(), y1=new Date(t1).getUTCFullYear(); const multiYear=y0!==y1;
  if(span<=10){ // weekly ticks: "3 nov"
    for(let t=t0;t<=t1+1;t+=WEEKMS){ const d=new Date(t); ticks.push({t,label:`${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`}); }
  } else { // month ticks: "nov" (with the year on January or when the range crosses years)
    const d=new Date(t0); let m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+(d.getUTCDate()>1?1:0),1));
    while(m.getTime()<=t1){ const mo=m.getUTCMonth(), yy=String(m.getUTCFullYear()).slice(2);
      ticks.push({t:m.getTime(),label:MONTHS[mo]+(multiYear&&(mo===0||!ticks.length)?` ${yy}`:""),jan:mo===0}); m=new Date(Date.UTC(m.getUTCFullYear(),mo+1,1)); }
  }
  if(ticks.length>maxL){ const step=Math.ceil(ticks.length/maxL); ticks=ticks.filter((x,i)=>i%step===0||x.jan&&multiYear); if(ticks.length>maxL+1) ticks=ticks.filter((x,i)=>i%2===0); }
  return ticks;
}
function drawCharts(root){
  root.querySelectorAll("[data-chart]").forEach(box=>{
    const spec=chartSpecs.get(box.dataset.chart); if(!spec) return;
    const W=Math.max(220,Math.floor(box.clientWidth)); const H=spec.h||210; box.style.minHeight=H+"px";
    const PL=40, PR=14, PT=12, PB=30; const cw=W-PL-PR, ch=H-PT-PB; const n=spec.points.length;
    const {min,max,invert}=spec;
    const timed=!!(spec.from&&spec.to);
    const t0=timed?weekMonday(spec.from).getTime():0, t1=timed?weekMonday(spec.to).getTime():1;
    const xt=t=>PL+(t1===t0?cw/2:(t-t0)/(t1-t0)*cw);
    const x=i=>timed?xt(weekMonday(spec.points[i].w).getTime()):PL+(n===1?cw/2:i*cw/(n-1));
    const y=v=>{ const r=Math.max(0,Math.min(1,(v-min)/((max-min)||1))); return invert?PT+r*ch:PT+ch-r*ch; };
    const css=getComputedStyle(box); const muted=css.getPropertyValue("--muted").trim(); const border=css.getPropertyValue("--border").trim(); const card=css.getPropertyValue("--card").trim()||"#fff";

    ticks.forEach(t=>{ g+=`<line x1="${PL}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}" stroke="${border}" stroke-dasharray="3 4"/><text x="${PL-7}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="${muted}">${esc(spec.fmt(t))}</text>`; });
    g+=`<line x1="${PL}" x2="${W-PR}" y1="${PT+ch}" y2="${PT+ch}" stroke="${border}"/>`;
    if(timed){
      const xs=[]; chartTicksX(t0,t1,W).forEach(tk=>{ const X=xt(tk.t); const prev=xs[xs.length-1];
        if(prev&&X-xt(prev.t)<46){ if(tk.jan&&!prev.jan) xs[xs.length-1]=tk; return; } xs.push(tk); });
      xs.forEach((tk,i)=>{ const X=xt(tk.t); const anchor=X-PL<18?"start":W-PR-X<18?"end":"middle";
        g+=`<line x1="${X}" x2="${X}" y1="${PT+ch}" y2="${PT+ch+4}" stroke="${muted}" stroke-opacity=".6"/><text x="${X}" y="${H-9}" text-anchor="${anchor}" font-size="11" fill="${muted}">${esc(tk.label)}</text>`; });
    } else {
      const maxLabels=W<360?4:6; const step=Math.max(1,Math.ceil(n/maxLabels));
      spec.points.forEach((p,i)=>{ if(i%step===0||i===n-1){ if(i!==n-1 && n-1-i<step*.6) return; const anchor=i===0?"start":i===n-1?"end":"middle"; g+=`<text x="${x(i)}" y="${H-9}" text-anchor="${anchor}" font-size="11" fill="${muted}">${esc(p.label)}</text>`; } });
    }
    const dense=timed?(t1-t0)/WEEKMS>16:n>16;
    spec.series.forEach(s=>{

      const flush=()=>{ if(seg.length>1){ d+=seg.map((p,j)=>(j?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+" "; } else if(seg.length===1){ g+=`<circle cx="${seg[0][0]}" cy="${seg[0][1]}" r="2.6" fill="${col}"/>`; } seg=[]; };
      spec.points.forEach((p,i)=>{ const v=p.values[s.key]; if(v==null){ flush(); return; } seg.push([x(i),y(v)]); }); flush();
      g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      spec.points.forEach((p,i)=>{ const v=p.values[s.key]; if(v==null) return; const last=spec.points.slice(i+1).every(q=>q.values[s.key]==null); if(dense&&!last) return; g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?4:2.6}" fill="${col}" ${last?`stroke="${card}" stroke-width="2"`:""}/>`; });
    });
    box.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria||"Gráfico")}">${g}<g class="cscrub"></g></svg><div class="ctip" hidden></div>`;
    // Touch or hover to read the exact values of a week
    if(!n) return;
    const svgG=box.querySelector(".cscrub"), tip=box.querySelector(".ctip");
    const show=cx=>{ let bi=0,bd=1e9; for(let i=0;i<n;i++){ const dd=Math.abs(x(i)-cx); if(dd<bd){bd=dd;bi=i;} }
      const p=spec.points[bi]; const X=x(bi);
      let h=`<line x1="${X}" x2="${X}" y1="${PT}" y2="${PT+ch}" stroke="${muted}" stroke-dasharray="2 3"/>`;
      const rows=spec.series.map(s=>({s,v:p.values[s.key]})).filter(r=>r.v!=null).sort((a,b)=>invert?a.v-b.v:b.v-a.v);
      rows.forEach(r=>{ h+=`<circle cx="${X}" cy="${y(r.v)}" r="5" fill="${r.s.color}" stroke="${card}" stroke-width="2"/>`; });
      svgG.innerHTML=h;
      const title=p.w?weekRange(p.w)+" "+p.w.slice(0,4):p.label;
      tip.innerHTML=`<b>${esc(title)}</b>${rows.length?rows.map(r=>`<span><i style="background:${r.s.color}"></i>${esc(r.s.name)}<em>${esc((spec.tipFmt||spec.fmt)(r.v))}</em></span>`).join(""):`<span>Sem dados</span>`}`;
      tip.hidden=false; const tw=tip.offsetWidth; let L=X+12; if(L+tw>W-4) L=X-12-tw; if(L<4) L=4; tip.style.left=L+"px"; };
    const hide=()=>{ svgG.innerHTML=""; tip.hidden=true; };
    const rel=e=>e.clientX-box.getBoundingClientRect().left;
    box.onpointerdown=e=>show(rel(e)); box.onpointermove=e=>{ if(e.pointerType==="mouse"||e.buttons||e.pressure>0) show(rel(e)); };
    box.onpointerleave=e=>{ if(e.pointerType==="mouse") hide(); };
    box.onpointerup=e=>{ if(e.pointerType!=="mouse"){ clearTimeout(box._t); box._t=setTimeout(hide,2500); } };
  });
}

function applyTheme(){
  const root=document.documentElement;
  if (S.theme==="system") root.removeAttribute("data-pes"); else root.setAttribute("data-pes",S.theme);
  const dark = S.theme==="dark" || (S.theme==="system" && (root.getAttribute("data-theme")==="dark" || (root.getAttribute("data-theme")!=="light" && matchMedia("(prefers-color-scheme: dark)").matches)));
  document.querySelector('meta[name="theme-color"]').content = dark?"#000000":"#F2F2F7";
}

/* Screens register chart specs while building their html, so reset the registry first. */
function render(){ if(S.swiping){ S.renderPending=true; return; } if(S.isOwner&&S.cfgRef&&!S.preview){ const mk=myRealMember(); if(mk&&S.ownerKey!==mk){ S.ownerKey=mk; S.cfgRef.update({ownerKey:mk}).catch(()=>{}); } } chartSpecs=new Map(); chartSeq=0; renderInner(); }
function renderInner(){
  applyLink();
  if(!S.wsChecked && ME() && curGroup() && (!S.fb || (S.peopleOk && S.loaded.has("ready")))){ S.wsChecked=true; setTimeout(()=>{ try{ if(!maybeBirthday() && !maybeNotifAnnouncement() && !maybeNews() && !maybeTribNews()) maybeWeeklySummary(); }catch(e){ console.warn(e); } },900); }
  const r=topRoute(); const key = r ? r.name+":"+(r.arg||"") : "tab:"+S.tab;
  const old=app.querySelector(".screen .scroll[data-key]"); if(old) scrollMem[old.dataset.key]=old.scrollTop;
  if (r?.name==="chat" && ME() && app.querySelector(`.screen[data-chat="${r.arg}"]`)) { updateChat(r.arg); markRead(r.arg); return; }
  const html=screenHtml(r);
  const scr=document.createElement("div"); scr.className="screen"; if(r?.name==="chat") scr.dataset.chat=r.arg;
  scr.innerHTML=html; const prev=app.querySelector(".screen:not(.under)"); app.querySelectorAll(".screen.under").forEach(x=>x.remove()); if(prev) app.replaceChild(scr,prev); else app.prepend(scr);
  const sc=scr.querySelector(".scroll[data-key]"); if(sc && scrollMem[sc.dataset.key]!=null) sc.scrollTop=scrollMem[sc.dataset.key];
  drawCharts(scr);
  if (r?.name==="chat" && ME()) { mountChat(r.arg, scr); markRead(r.arg); }
}
function screenHtml(r){
  let html;
  if (S.fb && S.authKnown && !S.uid) html=authScreen();
  else if (FBCFG && !S.authKnown) html=`<div class="center"><div class="spinner"></div></div>`;
  else if (!S.loaded.has("ready")) html=`<div class="center"><div class="spinner"></div><p class="muted small">${S.stale?"A base de dados ainda não respondeu. Verifica a ligação.":"A carregar…"}</p></div>`;
  else if (!ME() && S.fb && (!S.uidChecked || !S.peopleOk)) html=`<div class="center"><div class="spinner"></div><p class="muted small">${S.stale?"A base de dados ainda não respondeu. Verifica a ligação.":"A carregar…"}</p></div>`;
  else if (!ME()) html=claimScreen();
  else if (r) html=({group:groupScreen,settings:settingsScreen,chat:chatShell,awards:awardsScreen})[r.name](r.arg);
  else html=({rubricas:rubricasScreen,epoca:dashScreen,events:eventsScreen,gap:gapScreen})[normTab(S.tab)]() + tabbar();
  return html;
}

// Barra: Dashboard · Rubricas · [Votar] · Eventos · GAP. Cada coisa tem um só caminho.
const TAB_MAP={home:"epoca",dash:"epoca",hoje:"epoca",journey:"epoca"};
function normTab(t){ t=TAB_MAP[t]||t; return ["rubricas","epoca","events","gap"].includes(t)?t:"epoca"; }
function tabbar(){
  const g=curGroup(); const n=g?groupNotifs(g.id):{msgs:0,cant:0,evs:0}; const cur=normTab(S.tab);
  const voteDue=g&&!viewingPast(g.id)&&!votingClosed(g.id)&&!weekDone(g.id);
  const t=(id,label,icon,badge)=>`<button class="tab ${cur===id?"on":""}" data-act="tab" data-arg="${id}" aria-label="${label}${badge?`, ${badge} por ver`:""}">${ic(icon)}${badge?`<span class="badge num">${badge}</span>`:""}<span>${label}</span></button>`;
  const vote=`<button class="tab hometab ${voteDue?"due":""}" data-act="${g?"rank":"tab"}" data-arg="rubricas" aria-label="Pês: votação da semana${voteDue?", por fazer":""}"><span class="hbub">${ic(voteDue?"edit":"vote")}</span>${voteDue?`<span class="badge num">!</span>`:""}<span>Pês</span></button>`;
  return `<nav class="tabbar">${t("epoca","Dashboard","chart")}${t("rubricas","Rubricas","grid",n.cant)}${vote}${t("events","Eventos","cal",n.evs)}${t("gap","GAP","chat",n.msgs)}</nav>`;
}
function groupPill(withSeason){ const g=curGroup(); if(!g) return "";
  const ch=withSeason?seasonChoices(g.id):[]; const v=viewSeason(g.id);
  const pill=ch.length?`<button class="seasonpill ${viewingPast(g.id)?"past":""}" data-act="pickSeason" aria-label="Escolher época">${esc(seasonName(g.id,v))}${ic("down")}</button>`:"";
  return `<div class="gline"><div class="gname">${esc(g.name)}</div>${pill}</div>`; }
function seasonSheet(gid){ const ch=seasonChoices(gid); const v=viewSeason(gid); const cur=currentSeason(gid);
  openSheet({title:"Escolher época",left:"Fechar",short:true,body:()=>`<div class="card list">${ch.map(x=>{ const from=x.startD?shortDate(x.startD)+" "+x.startD.slice(0,4):"Início"; const to=x.gala?fmtDate(x.gala):"hoje";
    return `<button class="row" data-act="setSeason" data-arg="${gid}|${x.i}"><span style="font-size:22px">${x.i===cur.i?"🟢":"🏆"}</span><div class="grow"><div class="rowtitle">${esc(seasonName(gid,x))}${x.i===cur.i?" · atual":""}</div><div class="rowsub">${esc(from)} – ${esc(to)}${x.gala&&x.i!==cur.i?` · Gala ${esc(x.year)}`:""}</div></div>${x.i===v.i?`<span style="color:var(--accent)">${ic("check",'style="width:20px;height:20px"')}</span>`:""}</button>`; }).join("")}</div>
    <p class="info">As épocas passadas mostram os resultados finais. Para votar, volta à época atual.</p>`}); }
function pastSeasonBanner(g){ if(!viewingPast(g.id)) return ""; const v=viewSeason(g.id);
  return `<div class="banner pastbanner" style="margin-top:12px">${ic("cal")}<span>A ver a ${esc(seasonName(g.id,v))}, terminada na Gala de ${esc(fmtDate(v.gala))}.</span><button data-act="setSeason" data-arg="${g.id}|">Época atual</button></div>`; }
function noGroup(){ return `<div class="section"><div class="card"><div class="empty"><div class="ico">${ic("users")}</div><h3>Ainda não tens grupo</h3><p>Cria um grupo ou entra com um código de convite no separador Início.</p></div></div></div>`; }

const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || "pessoa";
document.addEventListener("submit",async e=>{
  if(e.target.id!=="newProfile") return; e.preventDefault();
  const name=document.getElementById("pname").value.trim().replace(/\s+/g," ");
  if(name.length<2){ alertD("Escreve o teu nome","Usa pelo menos 2 letras."); return; }
  if(myRealMember()) return;
  S.claimBusy=true; render();
  const key=slug(name)+"-"+Math.random().toString(36).slice(2,6);
  await write(()=> S.fb? fbCreateProfile(name) : D("people/"+key).set({name,uid:S.uid,photo:null,createdAt:Date.now()}),`Olá, ${first(name)}!`);
  S.claimBusy=false; S.route=[]; S.tab="epoca"; render();
});

function hojeHead(g){ const me=ME(); const n=g?groupNotifs(g.id):{msgs:0};
  const d=ymdToUTC(lisbonYMD()); const dn=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"][d.getUTCDay()];
  return `<div class="tabhead hojehead"><button class="hojeme" data-act="settings" aria-label="Perfil e definições">${avatar(me,40)}</button>
    <div class="titles" style="flex:1"><h1>Hoje</h1><div class="gline"><div class="gname">${esc(dn)}, ${esc(shortDate(lisbonYMD()))}${g?` · ${esc(g.name)}`:""}</div></div></div>
    ${g?`<button class="roundbtn gapbtn" data-act="tab" data-arg="gap" aria-label="GAP${n.msgs?`, ${n.msgs} mensagens por ler`:""}">${ic("chat")}${n.msgs?`<span class="badge num">${n.msgs}</span>`:""}</button>`:""}</div>`; }
function nextEventCard(g){ const me=ME(); const t=lisbonYMD(); const evs=groupEvents(g.id).filter(e=>(e.date||"")>=t&&(e.att||{})[me]!==undefined).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  const e=evs[0]; if(!e) return ""; const dd=daysUntil(e.date); const when=dd===0?"Hoje":dd===1?"Amanhã":`Daqui a ${dd} dias`;
  return `<button class="nowcard ev" data-act="tab" data-arg="events"><span class="nc-ico">📅</span><span class="grow"><b>${esc(e.title)}</b><small>${when} · ${esc(fmtDate(e.date))}${e.time?` às ${esc(e.time)}`:""}${e.place?` · ${esc(e.place)}`:""}</small></span>${ic("right")}</button>`; }
function galaCard(g){ const cs=currentSeason(g.id); if(!cs?.gala||viewingPast(g.id)) return ""; const dl=daysUntil(cs.gala); if(dl<0||dl>60) return "";
  return `<button class="nowcard ngala" data-act="awards"><span class="nc-ico">🎄</span><span class="grow"><b>${dl===0?"A Gala é hoje!":`Faltam ${dl} ${dl===1?"dia":"dias"} para a Gala`}</b><small>${esc(fmtDate(cs.gala))} · os prémios são revelados no jantar</small></span>${ic("right")}</button>`; }
function hojeScreen(){
  const g=curGroup(); const me=ME();
  if(!g) return `<div class="scroll pad-tabs" data-key="hoje">${hojeHead(null)}${previewBanner()}<div class="section"><div class="card"><div class="empty"><div class="ico">${ic("users")}</div><h3>Ainda não estás no grupo</h3><p>Entra com o código de convite que te enviaram.</p><button class="btn" style="margin-top:8px" data-act="joinGroup">${ic("link")}Entrar com código</button></div></div></div></div>`;
  const locked=rankLocked(g.id)&&!firstWeekReveal(g.id); const done=weekDone(g.id); const half=!done&&!!myRankingThisWeek(g.id); const nDone=g.members.filter(k=>weekDone(g.id,k)).length;
  const closed=votingClosed(g.id);
  const vote=closed?`<div class="banner" style="margin-top:0">${ic("lock")}<span>A época terminou na Gala. Os votos recomeçam na segunda-feira.</span></div>`
    :`<div class="stats"><button class="stat cta ${done?"done":""} ${!done&&voteUrgent()?"urgent":""}" data-act="rank">${ic(done?"check":"edit")}<span style="flex:1"><span class="k" style="display:block">${done?"Votação feita":half?"Falta acabar a votação":"Votação da semana"}</span><span class="s" style="display:block">${done?"Ranking, prémios e perguntas · toca para alterar":voteCtaSub(g)}</span></span><span class="rcount num" aria-label="${nDone} de ${g.members.length} membros já votaram esta semana"><b>${nDone}/${g.members.length}</b><small>votaram</small></span></button></div>`;
  const nb=nudgeBlock(g);
  const lockHero=locked?(()=>{ const n=(g.members||[]).length; const nIn=(g.members||[]).filter(k=>!rankLockedFor(g.id,k)).length; return `<button class="lockhero" data-act="tease"><div class="tease-emo">🔒</div><b>Esta semana estás cá fora</b><p>Não completaste a votação da semana passada. Vês os botões todos, mas não consegues abrir nada.</p><div class="fomo"><span>🔥 <b>${nIn} de ${n}</b> estão lá dentro esta semana.</span><span>⏳ Faz a votação desta semana para voltares no domingo às 21h.</span></div><small>Toca onde quiseres. Não vai adiantar 😇</small></button>`; })():"";
  const now=[pfCard(g),tribCard(g),cantinhoCard(g)].map(h=>h.trim().replace(/^<div class="section" style="margin-top:\d+px">([\s\S]*)<\/div>$/,"$1")).filter(Boolean);
  const extra=[nextEventCard(g),galaCard(g)].filter(Boolean);
  return `<div class="scroll pad-tabs" data-key="hoje">${hojeHead(g)}${previewBanner()}${bdayBanner(g)}${nudgedBanner(g)}${seasonBanner(g)}
    ${lockHero?`<div class="section" style="margin-top:14px">${lockHero}</div>`:""}
    <div class="section" style="margin-top:14px">${vote}${nb?`<div style="margin-top:10px">${nb}</div>`:""}</div>
    <section class="section dsec"><div class="dhead"><span class="dh-emo">✨</span><h3>A acontecer agora</h3></div><div class="nowlist">${now.join("")}${extra.join("")}</div></section>
  </div>`; }
const rankLockedFor=(gid,k)=>{ const pw=lastClosedWeek(); return !weekComplete(gid,k,pw); };
/* ───────────────────────── screens: Rubricas ───────────────────────── */
function rubricasScreen(){
  const g=curGroup(); const me=ME();
  const head=`<div class="tabhead"><div class="titles"><h1>Rubricas</h1>${groupPill()}</div></div>`;
  if(!g) return `<div class="scroll pad-tabs" data-key="rubricas">${head}${previewBanner()}<div class="section"><div class="card"><div class="empty"><div class="ico">${ic("users")}</div><h3>Ainda não estás no grupo</h3><p>Entra com o código de convite que te enviaram.</p><button class="btn" style="margin-top:8px" data-act="joinGroup">${ic("link")}Entrar com código</button></div></div></div></div>`;
  const locked=rankLocked(g.id)&&!firstWeekReveal(g.id); const t=[];
  { const c=cantinhoOf(g.id); const past=pastCantinhos(g.id).length; const lk=locked&&!c;
    t.push(dtile("cantHub","c7",`Cantinho${!lk&&c&&isUnread({id:c.id,...c})?` <span class="dt-new">novo</span>`:""}`,lk?"":c?(c.host===me?"É a tua vez!":`É a vez do ${esc(first(nm(c.host)))}`):past?`${past} ${past===1?"anterior":"anteriores"}`:"A sortear…",dtEmo("🛋️"),lk)); }
  if(sidKey(g.id)&&(g.members||[]).length>=3){ const c=trCur(g.id); const tl=trLocked(g.id);
    t.push(dtile("trib","c3","Tribunal do Sr. Sid",tl?"":c.no?`Processo ${esc(c.no)}`:c.status==="trial"?"Em julgamento":c.status==="sub"?"Acusações abertas":"Esta semana",dtEmo("⚖️"),tl)); }
  { const ed=pfEd(); t.push(dtile("dashPF","c2","Preferias Flash",locked?"":ed?(pfDone(g.id)?"Feito hoje ✓":"Dilema de hoje"):"Às 21:30",`<img src="${PF_LOGO}" alt="">`,locked)); }

/* Mark a conversation as read up to its newest message. Called when it opens, when new messages arrive,
   when the chat document changes while it is open, and when the app comes back to the foreground. */
async function markRead(cid){ const me=ME(); const c=S.chats[cid]; if(!me||!c) return;
  clearChatNotifs(cid);
  const lastMsg=chatId===cid&&chatMsgs.length?chatMsgs[chatMsgs.length-1].at||0:0;
  const v=Math.max(c.lastAt||0,lastMsg); if(!v) return; const cur=S.reads[me]?.chats?.[cid]||0; if(cur>=v) return;
  S.reads={...S.reads,[me]:{...(S.reads[me]||{}),chats:{...(S.reads[me]?.chats||{}),[cid]:v}}}; // show it as read right away
  try{ await D("reads/"+me).update({chats:{[cid]:v}}); }catch{ try{ await D("reads/"+me).set({chats:{[cid]:v}}); }catch{} } }
/* Remove this conversation's notifications from the phone's notification centre */
async function clearChatNotifs(cid){ try{ const reg=await navigator.serviceWorker?.getRegistration(); const ns=await reg?.getNotifications?.({tag:"chat-"+cid}); (ns||[]).forEach(n=>n.close()); }catch{} }
/* Auto-update: when the app comes to the foreground, check if a newer version was published and reload */
const MYVER=document.querySelector('meta[name="pes-version"]')?.content||"dev"; let lastVerCheck=0;
async function checkUpdate(){ if(MYVER==="dev"||!/^https?:/.test(location.protocol)) return; if(Date.now()-lastVerCheck<30000) return; lastVerCheck=Date.now();
  try{ const t=await (await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"})).text(); const m=t.match(/name="pes-version" content="([^"]+)"/);
    if(m&&m[1]!==MYVER){ const a=document.activeElement; if((a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))||[...document.querySelectorAll(".layer textarea,.layer input[type=text],.layer input:not([type])")].some(i=>i.value.trim())){ lastVerCheck=0; return; } // não recarregar a meio de um texto
      const u=new URL(location.href); if(u.searchParams.get("v")===m[1]) return; u.searchParams.set("v",m[1]); location.replace(u.toString()); } }catch{} }
setTimeout(checkUpdate,3000); setInterval(()=>{ if(document.visibilityState==="visible") checkUpdate(); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ S.wsChecked=false; checkUpdate(); const cid=openChatId(); if(cid) markRead(cid); scheduleRender(); } });

function pfResultHtml(gid,q){ const g=S.groups[gid]; const me=ME(); const who={A:[],B:[]}; (g?.members||[]).forEach(k=>{ const v=pfAns(k,q); if(v==="A"||v==="B") who[v].push(k); });

function pfResSheet(gid,day){ const me=ME(); const ed=pfEd(); const all=[]; for(let d=addDays(ed,-1);d>=PF_DAY0&&all.length<14;d=addDays(d,-1)) all.push(pfItem(gid,d));
  openSheet({title:"⚡ Resultados",left:"Fechar",body:()=>{ const q=pfItem(gid,day); const mine=pfAns(me,q);

function pfSheet(){ const g=curGroup(); if(!g) return; const me=ME(); const day=pfEd(); const q=day&&pfItem(g.id,day);

      b.classList.add("pick"); const v=b.dataset.pf;

      const ok=await write(()=>D("votes/"+me).set(doc),"Preferias Flash feito ⚡"); if(!ok){ b.classList.remove("pick"); return; }
      pick=v; setTimeout(()=>{ L.render(); L.body.scrollTop=0; },180); }); }}); }
/* ───────── ⚖️ Tribunal do Sr. Sid ─────────
   Semana de calendário (seg–dom, Lisboa): casos até terça 17:00 → veredicto até quinta 20:00 → reações até sexta 20:00 → recurso até domingo 21:00.
   Os membros só escrevem no seu reads/{key} (privado). O servidor (cantinho.mjs) passa os casos ao Meritíssimo e publica tudo em groups/{id}.trib. */
const MER="Meritíssimo Sr. Sid";
const TR_SUB=1440+17*60, TR_VERD=3*1440+20*60, TR_RX=4*1440+20*60, TR_APP=6*1440+21*60;
function trMins(){ const t=pfLx(); return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(t.dow)*1440+t.mins; }
const trWeek=()=>weekOf(lisbonYMD());
function sidKey(gid){ const g=S.groups[gid]; return g?.trib?.sid||(g?.members||[]).find(k=>/^sid\b/i.test(S.people[k]?.name||""))||null; }
const isSid=gid=>!!ME()&&sidKey(gid)===ME();
// quem não votou fica de fora do tribunal, exceto o acusado do processo desta semana (vê o seu processo e pode reagir)
const trAccusedIn=gid=>{ const c=trCur(gid); return !!c.accused&&c.accused===ME(); };
const trLocked=gid=>rankLocked(gid)&&!isSid(gid)&&!trAccusedIn(gid);
const trOnlyCase=gid=>rankLocked(gid)&&!isSid(gid)&&trAccusedIn(gid);
function trCur(gid){ const t=S.groups[gid]?.trib; const w=trWeek(); return t?.cur?.w===w?t.cur:{w,status:"sub"}; }
const trRes=r=>r==="cond"?"Condenado":"Absolvido";
const trLeft=end=>fmtLeft(Math.max(0,(end-trMins())*6e4));
async function readsMerge(obj){ const me=ME(); const dm=(a,b)=>{ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])) a[k]=dm({...(a[k]||{})},b[k]); else if(b[k]===undefined) delete a[k]; else a[k]=b[k]; } return a; };
  const next=dm({...(S.reads[me]||{})},obj); S.reads={...S.reads,[me]:next};
  if(S.fb){ const fix=o=>{ const r={}; for(const k in o) r[k]=o[k]===undefined?firebase.firestore.FieldValue.delete():(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])?fix(o[k]):o[k]); return r; }; await S.raw.doc("reads/"+me).set(fix(obj),{merge:true}); }
  else await D("reads/"+me).set(next); }
function tribStatus(gid){ const c=trCur(gid); const m=trMins(); const sid=isSid(gid);
  if(c.status==="sub"&&m<TR_SUB) return sid?`Caixa: ${Object.values(S.reads[ME()]?.trib?.inbox||{}).filter(x=>x.gid===gid&&x.w===c.w).length} casos · fecha terça às 17:00`:`Acusa alguém até terça às 17:00 · anónimo 🤫`;
  if(c.status==="sub") return sid?"Escolha o caso a levar a julgamento":`O ${MER} está a escolher o caso a julgar…`;
  if(c.status==="trial") return sid?"Profira a sentença até quinta às 20:00":`Em julgamento: “${c.title}” · sentença até quinta às 20:00`;
  if(c.status==="verdict") return `Processo n.º ${c.no}: ${trRes(c.result).toUpperCase()} · reage até sexta às 20:00`;
  if(c.status==="appeal") return `Processo n.º ${c.no} em recurso · decisão até domingo às 21:00`;
  if(c.status==="final") return `Processo n.º ${c.no}: ${trRes(c.final).toUpperCase()} · transitou em julgado`;
  return "Semana sem julgamento"; }
function tribCard(g){ if((g.members||[]).length<3||!sidKey(g.id)) return ""; const locked=trLocked(g.id);
  return `<div class="section" style="margin-top:14px"><button class="tribcard" data-act="${locked?"tease":"trib"}"><span class="trib-ico">⚖️</span><span class="grow"><b>${trCur(g.id).no?`Processo n.º ${esc(trCur(g.id).no)}`:"Esta semana no tribunal"}</b><small>${locked?"Não completaste a votação da semana passada: o tribunal não te recebe 🔒":esc(tribStatus(g.id).replace(/^Processo n\.º [^:]+: /,""))}</small></span>${ic(locked?"lock":"right")}</button></div>`; }
function trCaseCard(gid,c,me){ const acc=c.accused;
  const res=c.status==="final"?c.final:c.result; const rev=c.appeal?.decision==="revise";
  return `<div class="card pad trcase"><div class="trno">${c.no?`Processo n.º ${esc(c.no)}`:"⏳ Em julgamento"}</div><h3 class="trtitle">${esc(c.title)}</h3>${c.desc?`<p class="trdesc">${esc(c.desc)}</p>`:""}
    <div class="trwho">${avatar(acc,28)}<span>Acusado: <b>${esc(nm(acc))}</b>${acc===me?" (tu)":""}</span></div>
    ${!res?`<div class="trres wait">⏳ A AGUARDAR SENTENÇA</div>`:""}<div class="trres ${res}" ${res?"":'style="display:none"'}>${res==="cond"?"🔨 CONDENADO":"🕊️ ABSOLVIDO"}${c.status==="appeal"?" · em recurso":""}${rev?" · sentença revista":""}</div>
    ${c.text?`<div class="trsent"><small>Sentença do ${MER}</small><p>${esc(c.text)}</p></div>`:""}
    ${res==="cond"&&c.penalty?`<div class="trpen">⚖️ Pena: <b>${esc(c.penalty)}</b></div>`:""}
    ${c.sum&&c.status==="final"?`<button class="btn block" data-act="tribSum" style="margin-top:14px">📜 Ver o resumo do processo</button>`:""}
    ${c.rxFinal?`<div class="label" style="margin:14px 0 6px">O povo reagiu · toca para ver quem</div><div class="trrx">${[["jf","👏","Justiça feita"],["rec","🔁","Recurso"]].map(([k,e,l])=>`<button class="trrxb" data-trwho="${k}"><span>${e}</span><b>${l}</b><small>${c.rxFinal[k]||0}</small></button>`).join("")}</div>`:""}
    ${c.appeal&&c.appeal.decision!=="none"?`<div class="trsent"><small>Decisão do recurso</small><p><b>${c.appeal.decision==="keep"?"Sentença mantida":"Sentença revista"}.</b> ${esc(c.appeal.text||"")}</p>${c.appeal.decision==="keep"?`<p class="muted" style="margin-top:4px">Quem pediu recurso deve um fino ao ${MER} 🍺</p>`:""}</div>`:""}
    ${c.appeal?.decision==="none"?`<div class="trsent"><p class="muted">O recurso caducou: o ${MER} não se pronunciou. A sentença mantém-se, sem finos.</p></div>`:""}</div>`; }
function TR_DISC_WRAP(f){ return ()=>{ const h=f(); return h+`<p class="trdisc">⚠️ <b>Aviso legal:</b> as acusações, sentenças e penas do Tribunal do Sr. Sid são da exclusiva responsabilidade do ${MER} e de quem as submete. O Cláudio e o criador da app não se responsabilizam por nada do que aqui se decide.</p>`; }; }
function tribSheet(){ const g=curGroup(); if(!g) return; const gid=g.id; const me=ME(); if(trLocked(gid)){ teaseSheet(); return; }

    const only=trOnlyCase(gid); if(only) st.tab="now"; const tabs=only?`<p class="info" style="text-align:center;margin:0 0 12px">Não completaste a votação da semana passada, mas és o acusado: podes ver o teu processo e reagir ao veredicto.</p>`:`<div class="seg" style="margin-bottom:14px">${[["now","Esta semana"],["pens","Penas"],["cad","Cadastro"]].map(([k,l])=>`<button data-trtab="${k}" class="${st.tab===k?"on":""}">${l}</button>`).join("")}</div>`;

      out+=`<div class="label">Por cumprir (${open.length})</div>${open.length?`<div class="card list">${open.map(row).join("")}</div>`:`<p class="info">Nenhuma pena por cumprir. A justiça descansa 😇</p>`}`;

        return `<button class="row" data-trcad="${k}">${avatar(k,34)}<div class="grow"><div class="rowtitle">${esc(nm(k))}</div><div class="rowsub">${h.length?`${h.length} ${h.length===1?"processo":"processos"} · ${nc} ${nc===1?"condenação":"condenações"}`:"Cadastro limpo"}</div></div>${ic("right",'style="width:18px;height:18px;color:var(--muted);flex:none"')}</button>`; }).join("")}</div>`; return out; }
    // ── esta semana ──

          <div class="seg" style="margin-bottom:10px"><button data-trres="cond" class="${st.res==="cond"?"on":""}">🔨 Condenado</button><button data-trres="abs" class="${st.res==="abs"?"on":""}">🕊️ Absolvido</button></div>
          <div class="field"><label for="trsent">Sentença</label><textarea id="trsent" class="input" maxlength="8000" rows="4" placeholder="Este tribunal, em nome do povo do El Calderón…"></textarea></div>

          <div class="field" style="margin-top:12px"><label for="trtitle">Título do caso</label><input id="trtitle" class="input" maxlength="120" placeholder="Ex.: O caso da última fatia"></div>

    c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size); return c.toDataURL("image/jpeg",.82); }
  finally{ URL.revokeObjectURL(url); }
}

/* Replace the whole store with `docs` (path → body), deleting everything else. Paced writes with retries and a progress overlay. */
async function bulk(docs,label){
  const L=pushLayer(`<div class="overlay"></div><div class="dialog"><div class="dt"><div class="spinner" style="margin:0 auto 12px"></div><h3></h3><p class="num">A preparar…</p></div></div>`);
  L.el.querySelector("h3").textContent=label+"…"; const p=L.el.querySelector("p");
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const retry=async fn=>{ for(let i=0;;i++){ try{ return await fn(); } catch(e){ if(i<6&&["resource_exhausted","unavailable","resource-exhausted"].includes(e?.code)){ await sleep(500*2**i); continue; } throw e; } } };
  try{
    const del=[];
    for(const c of S.fb?[...COLS,"uids"]:[...COLS,"owners","profiles"]){ const snap=await retry(()=>S.db.collection(c).get()); for(const d of snap.docs){ del.push(`${c}/${d.id}`);
      if(c==="chats"){ const ms=await retry(()=>S.db.collection(`chats/${d.id}/msgs`).get()); ms.docs.forEach(m=>del.push(`chats/${d.id}/msgs/${m.id}`)); } } }
    const toDel=del.filter(x=>!(x in docs)); const toSet=Object.entries(docs); const total=toDel.length+toSet.length; let n=0;
    if(S.fb){ const ops=[...toDel.map(x=>[x,null]),...toSet];
      for(let i=0;i<ops.length;i+=400){ const b=S.raw.batch(); ops.slice(i,i+400).forEach(([path,body])=> body===null? b.delete(S.raw.doc(path)) : b.set(S.raw.doc(path),body)); await retry(()=>b.commit()); n+=Math.min(400,ops.length-i); p.textContent=`${n} de ${total}`; } }
    else {
    for(const path of toDel){ await retry(()=>D(path).delete()); p.textContent=`${++n} de ${total}`; await sleep(25); }
    for(const [path,body] of toSet){ await retry(()=>D(path).set(body)); p.textContent=`${++n} de ${total}`; await sleep(25); } }
    popLayer(L); return true;
  } catch(e){ popLayer(L); await alertD("A operação parou a meio","Tenta outra vez. Os dados podem ter ficado incompletos até repetires."); return false; }
}

/* ───────── swipe from the left edge to go back (like iOS) ───────── */
(()=>{
  let sw=null; const EDGE=28;
  function target(){
    const L=layers[layers.length-1];
    if(L){ const c=L.el.querySelector("[data-close],[data-x]"); if(!c) return null;
      return {el:L.el.querySelector(".sheet,.actions,.viewer,.gala")||L.el, overlay:L.el.querySelector(".overlay"), done:()=>c.click()}; }
    if(!ME()) return null;
    const cur=app.querySelector(".screen:not(.under)"); if(!cur) return null;
    if(S.route.length) return {el:cur, page:true, prev:{route:S.route.slice(0,-1),tab:S.tab}, done:()=>back()};
    if(S.tab!=="home") return {el:cur, page:true, prev:{route:[],tab:"home"}, done:()=>setTab("home")};
    return null;
  }
  function makeUnder(prev){
    const top=prev.route[prev.route.length-1]; if(top?.name==="chat") return null;
    const keep={route:S.route,tab:S.tab}; S.route=prev.route; S.tab=prev.tab;
    let html=""; try{ chartSpecs=new Map(); chartSeq=0; html=screenHtml(top); } finally { S.route=keep.route; S.tab=keep.tab; }
    const u=document.createElement("div"); u.className="screen under"; u.innerHTML=html; app.insertBefore(u,app.firstChild);
    const sc=u.querySelector(".scroll[data-key]"); if(sc&&scrollMem[sc.dataset.key]!=null) sc.scrollTop=scrollMem[sc.dataset.key];
    try{ drawCharts(u); }catch{} return u;
  }
  const W=()=>app.clientWidth;
  app.addEventListener("touchstart",e=>{ sw=null; if(e.touches.length!==1) return;
    const x=e.touches[0].clientX-app.getBoundingClientRect().left; if(x>EDGE) return;
    const t=target(); if(!t||!t.el) return; sw={...t,x0:e.touches[0].clientX,y0:e.touches[0].clientY,t0:Date.now(),dx:0,on:false}; },{passive:true});
  app.addEventListener("touchmove",e=>{ if(!sw) return; const p=e.touches[0]; const dx=p.clientX-sw.x0, dy=p.clientY-sw.y0;
    if(!sw.on){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ sw=null; return; } if(dx<8) return;
      sw.on=true; S.swiping=true; sw.el.style.transition="none"; sw.el.classList.add("swiping"); document.activeElement?.blur?.();
      if(sw.page){ sw.under=makeUnder(sw.prev); if(sw.under){ sw.under.style.transition="none"; } } }
    e.preventDefault(); sw.dx=Math.max(0,dx); const f=sw.dx/W();
    sw.el.style.transform=`translateX(${sw.dx}px)`;
    if(sw.under) sw.under.style.transform=`translateX(${-30*(1-f)}%)`;
    if(sw.overlay) sw.overlay.style.opacity=String(Math.max(0,1-f)); },{passive:false});
  function end(){ if(!sw) return; const s=sw; sw=null; if(!s.on) return;
    const v=s.dx/Math.max(1,Date.now()-s.t0); const ok=s.dx>W()*0.35||(v>0.45&&s.dx>50);
    const ease="transform .25s cubic-bezier(.2,.8,.2,1)";
    s.el.style.transition=ease; if(s.under) s.under.style.transition=ease;
    if(s.overlay){ s.overlay.style.transition="opacity .25s"; s.overlay.style.opacity=ok?"0":""; }
    if(ok){ s.el.style.transform=`translateX(${W()}px)`; if(s.under) s.under.style.transform="translateX(0)";
      setTimeout(()=>{ if(s.under){ s.under.remove(); } S.swiping=false; S.renderPending=false; s.done(); },240); }
    else { s.el.style.transform=""; if(s.under) s.under.style.transform="translateX(-30%)";
      setTimeout(()=>{ s.el.style.transition=""; s.el.classList.remove("swiping"); s.under?.remove(); S.swiping=false; if(S.renderPending){ S.renderPending=false; render(); } },260); } }
  app.addEventListener("touchend",end); app.addEventListener("touchcancel",end);
})();

/* ───────────────────────── event photos ───────────────────────── */
async function toPhoto(file,max=1280){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*r); c.height=Math.round(img.naturalHeight*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=.75, out=c.toDataURL("image/jpeg",q); while(out.length>850000&&q>.35){ q-=.1; out=c.toDataURL("image/jpeg",q); } return out; }
  finally{ URL.revokeObjectURL(url); }
}

function photoViewer(eid,photos,i){
  const e=S.events[eid]; const me=ME();

  const show=()=>{ const p=photos[i]; L.el.querySelector("img").src=p.data; L.el.querySelector(".cnt").textContent=`${nm(p.by)} · ${i+1}/${photos.length}`;
    L.el.querySelector("[data-del]").style.visibility=(p.by===me||e?.createdBy===me||S.isOwner)?"visible":"hidden";
    L.el.querySelector("[data-prev]").style.visibility=i>0?"visible":"hidden"; L.el.querySelector("[data-next]").style.visibility=i<photos.length-1?"visible":"hidden"; };
  L.el.querySelector("[data-x]").onclick=()=>popLayer(L);
  L.el.querySelector("[data-prev]").onclick=()=>{ if(i>0){ i--; show(); } };

  show();
}

function seasonBanner(g){
  const closed=votingClosed(g.id); const s=currentSeason(g.id); const last=pastGalas(g.id).pop();
  if(closed) return `<div class="section" style="margin-top:12px"><button class="galabanner" data-act="openGala" data-arg="${g.id}|${closed.i}"><span class="ge">🎉</span><span style="flex:1;text-align:left"><b>A Gala ${esc(closed.year)} já foi</b><small>Começa uma época nova: tudo recomeça do zero segunda-feira. Toca para rever a gala.</small></span>${ic("right")}</button></div>`;

function galaBanner(g){
  const s=currentSeason(g.id); const admin=isAdmin(g); const last=pastGalas(g.id).pop(); const t=lisbonYMD();
  const b=(act,arg,emo,title,sub)=>`<button class="galabanner" data-act="${act}" data-arg="${arg}"><span class="ge">${emo}</span><span style="flex:1;text-align:left"><b>${title}</b><small>${sub}</small></span>${ic("right")}</button>`;
