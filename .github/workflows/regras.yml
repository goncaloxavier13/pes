name: Publicar regras da base de dados
on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json]
  workflow_dispatch: {}
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credenciais
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          if [ -z "$SA" ]; then echo "Falta o segredo FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npx -y firebase-tools@13 deploy --only firestore:rules --project pespes-app --non-interactive
