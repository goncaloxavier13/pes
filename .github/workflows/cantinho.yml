name: Cantinho
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_week:
        description: "Simular uma semana sem gravar nada (ex.: 2026-W48). Vazio = a sério."
        required: false
        default: ""
concurrency: { group: cantinho, cancel-in-progress: false }
jobs:
  cantinho:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund firebase-admin@12 web-push@3
      - run: node scripts/cantinho.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAPID_PUBLIC_KEY: BKVV4FGmIviV08QQxwpstFJB01wVpB9bs2zICxXeGPo2b4TTn3hY9CUaE2v1PFeERjsp4rUwJAoRUDtgK23nNI8
          DRY_WEEK: ${{ inputs.dry_week }}
