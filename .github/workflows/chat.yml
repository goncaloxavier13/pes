name: Chat
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
concurrency: { group: chatwatch, cancel-in-progress: false }
permissions: { actions: write, contents: read }
jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund firebase-admin@12 web-push@3
      - run: node scripts/chatwatch.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: BKVV4FGmIviV08QQxwpstFJB01wVpB9bs2zICxXeGPo2b4TTn3hY9CUaE2v1PFeERjsp4rUwJAoRUDtgK23nNI8
          MINUTES: "50"
      - name: Continuar a vigiar (bloco seguinte)
        if: always()
        run: gh workflow run chat.yml --repo ${{ github.repository }}
        env: { GH_TOKEN: "${{ github.token }}" }
