name: Anúncio
on:
  workflow_dispatch:
    inputs:
      title: { description: "Título", required: true }
      body: { description: "Texto", required: false, default: "" }
      query: { description: "Parâmetros do link (ex.: &news=1)", required: false, default: "" }
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund firebase-admin@12 web-push@3
      - run: node scripts/announce.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: BKVV4FGmIviV08QQxwpstFJB01wVpB9bs2zICxXeGPo2b4TTn3hY9CUaE2v1PFeERjsp4rUwJAoRUDtgK23nNI8
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          QUERY: ${{ inputs.query }}
